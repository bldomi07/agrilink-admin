<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgriLink Admin — Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .photo-pick { margin-top: 6px; border: 2px dashed #cfd8d2; border-radius: 10px; padding: 12px; text-align: center; background: #fbfdfb; cursor: pointer; font-size: 13px; color: #555; }
    .photo-pick.has-file { border-color: #1e7a3c; background: #e8f3ec; color: #146c34; font-weight: 600; }
    .photo-pick input[type=file] { display: none; }
    .file-pick { margin-top: 6px; border: 2px dashed #cfd8d2; border-radius: 10px; padding: 12px; text-align: center; background: #fbfdfb; cursor: pointer; font-size: 13px; color: #555; }
    .file-pick.has-file { border-color: #1e7a3c; background: #e8f3ec; color: #146c34; font-weight: 600; }
    .file-pick input[type=file] { display: none; }
    .ad-thumb { width: 100%; max-height: 140px; object-fit: cover; border-radius: 10px; margin-top: 6px; }
    .location-line { font-size: 12px; color: #555; margin-top: 2px; }
    .location-line strong { color: #1c1c1c; }
    .or-sep { text-align: center; font-size: 12px; color: #aaa; margin: 10px 0 6px; }
    .hint { font-size: 11px; color: #888; margin: 2px 0 8px; }

    /* Inline profile edit */
    .edit-form { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #dfe6e1; }
    .edit-form.show { display: block; }
    .edit-form label { display: block; margin-top: 10px; font-size: 12px; font-weight: 600; color: #333; }
    .edit-form input { width: 100%; padding: 10px; font-size: 14px; margin-top: 4px; border: 1px solid #cfd8d2; border-radius: 8px; background: #fbfdfb; font-family: inherit; }
    .role-box { margin-top: 4px; border: 1px solid #cfd8d2; border-radius: 8px; padding: 2px 10px; background: #fbfdfb; }
    .role-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #eef3ef; }
    .role-row:last-child { border-bottom: 0; }
    .role-row input[type=checkbox] { width: 18px; height: 18px; margin: 0; accent-color: #1e7a3c; }
    .role-row label { margin: 0; font-weight: 500; font-size: 14px; color: #1c1c1c; flex: 1; cursor: pointer; }
    .edit-actions { display: flex; gap: 6px; margin-top: 12px; }
    .edit-actions button { flex: 1; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; border: 0; }
    .btn-save { background: #1e7a3c; color: #fff; }
    .btn-save:disabled { opacity: 0.6; }
    .btn-cancel { background: #eee; color: #333; }
    .edit-msg { margin-top: 8px; font-size: 12px; text-align: center; min-height: 16px; }
    .edit-msg.ok { color: #146c34; }
    .edit-msg.error { color: #b00020; }

    /* Search bar */
    .search-bar { margin-bottom: 12px; display: flex; gap: 8px; }
    .search-bar input { flex: 1; padding: 10px 14px; border: 1px solid #cfd8d2; border-radius: 8px; font-size: 14px; background: #fff; font-family: inherit; }
    .search-bar button { padding: 10px 14px; background: #eee; border: 1px solid #cfd8d2; border-radius: 8px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div>
        <strong>AgriLink Admin</strong>
        <div class="small" id="whoami"></div>
      </div>
      <button class="btn-outline" id="logoutBtn">Log out</button>
    </header>

    <div class="grid">
      <button class="tile" data-view="settings">⚙️ Settings</button>
      <button class="tile" data-view="admins">🛡️ Admins</button>
      <button class="tile" data-view="profiles">👤 Profiles</button>
      <button class="tile" data-view="products">📦 Products</button>
      <button class="tile" data-view="listings">📋 Listings</button>
      <button class="tile" data-view="reports">🚩 Reports</button>
      <button class="tile" data-view="ads">📣 Ads</button>
      <a class="tile" href="app-ads.html">📱 App Ads</a>
    </div>

    <div id="view" class="view"></div>
  </div>

  <script src="supabase.js"></script>
  <script>
    const ALL_ROLES = [
      { v: 'farmer', l: 'Farmer' },
      { v: 'buyer', l: 'Buyer' },
      { v: 'seller', l: 'Seller' },
      { v: 'service_provider', l: 'Service Provider' },
      { v: 'job_seeker', l: 'Job Seeker' },
      { v: 'transport_provider', l: 'Transport Provider' },
      { v: 'machinery_provider', l: 'Machinery Provider' }
    ];

    let currentView = '';

    async function init() {
      const session = await requireAuth();
      if (!session) return;
      const admin = await isAdmin();
      if (!admin) { await logout(); return; }
      document.getElementById('whoami').textContent = session.user.email;
      document.getElementById('logoutBtn').addEventListener('click', logout);
      document.querySelectorAll('.tile[data-view]').forEach(t => {
        t.addEventListener('click', () => loadView(t.dataset.view));
      });
    }

    async function loadView(name) {
      currentView = name;
      const view = document.getElementById('view');
      view.innerHTML = '<p class="small">Loading…</p>';
      try {
        if (name === 'settings') return await renderSettings(view);
        if (name === 'admins')   return await renderAdmins(view);
        if (name === 'profiles') return await renderProfiles(view);
        if (name === 'products') return await renderProducts(view);
        if (name === 'listings') return await renderListings(view);
        if (name === 'reports')  return await renderReports(view);
        if (name === 'ads')      return await renderAds(view);
      } catch (err) {
        console.error('loadView error:', err);
        view.innerHTML = '<p class="msg">Error: ' + escapeHtml(err && err.message ? err.message : String(err)) + '</p>';
      }
    }

    // ---------------- SETTINGS ----------------
    async function renderSettings(view) {
      const s = await getSettings();
      if (!s) { view.innerHTML = '<p class="small">No settings row found.</p>'; return; }
      view.innerHTML = `
        <h2>Settings</h2>
        <form id="settingsForm">
          <label>Platform name</label><input id="platform_name" value="${escapeHtml(s.platform_name ?? '')}">
          <label>Tagline</label><input id="tagline" value="${escapeHtml(s.tagline ?? '')}">
          <label>Support email</label><input id="support_email" value="${escapeHtml(s.support_email ?? '')}">
          <label>Support phone</label><input id="support_phone" value="${escapeHtml(s.support_phone ?? '')}">
          <label>Country</label><input id="country" value="${escapeHtml(s.country ?? '')}">
          <label>Currency code</label><input id="currency_code" value="${escapeHtml(s.currency_code ?? '')}">
          <label>Currency symbol</label><input id="currency_symbol" value="${escapeHtml(s.currency_symbol ?? '')}">
          <label>Language</label><input id="language" value="${escapeHtml(s.language ?? '')}">
          <label class="check"><input type="checkbox" id="feature_products" ${s.feature_products ? 'checked' : ''}> Product listings</label>
          <label class="check"><input type="checkbox" id="feature_services" ${s.feature_services ? 'checked' : ''}> Services</label>
          <label class="check"><input type="checkbox" id="feature_jobs" ${s.feature_jobs ? 'checked' : ''}> Jobs</label>
          <label class="check"><input type="checkbox" id="feature_ads" ${s.feature_ads ? 'checked' : ''}> Advertisements</label>
          <label class="check"><input type="checkbox" id="feature_advisory" ${s.feature_advisory ? 'checked' : ''}> Advisory</label>
          <label class="check"><input type="checkbox" id="maintenance_mode" ${s.maintenance_mode ? 'checked' : ''}> Maintenance mode</label>
          <button type="submit" id="saveSettingsBtn">Save</button>
          <p id="settingsMsg" class="small"></p>
        </form>
      `;
      document.getElementById('settingsForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = document.getElementById('settingsMsg');
        const btn = document.getElementById('saveSettingsBtn');
        msg.textContent = 'Saving…'; btn.disabled = true;
        const updates = {
          platform_name:    document.getElementById('platform_name').value.trim(),
          tagline:          document.getElementById('tagline').value.trim(),
          support_email:    document.getElementById('support_email').value.trim(),
          support_phone:    document.getElementById('support_phone').value.trim(),
          country:          document.getElementById('country').value.trim(),
          currency_code:    document.getElementById('currency_code').value.trim(),
          currency_symbol:  document.getElementById('currency_symbol').value.trim(),
          language:         document.getElementById('language').value.trim(),
          feature_products: document.getElementById('feature_products').checked,
          feature_services: document.getElementById('feature_services').checked,
          feature_jobs:     document.getElementById('feature_jobs').checked,
          feature_ads:      document.getElementById('feature_ads').checked,
          feature_advisory: document.getElementById('feature_advisory').checked,
          maintenance_mode: document.getElementById('maintenance_mode').checked,
        };
        try { await updateSettings(updates); msg.textContent = '✅ Saved.'; }
        catch (err) { msg.textContent = '❌ ' + escapeHtml(err.message || 'Failed.'); }
        finally { btn.disabled = false; }
      });
    }

    // ---------------- ADMINS ----------------
    async function renderAdmins(view) {
      const admins = await getAdmins();
      view.innerHTML = '<h2>Admins</h2>' + tableFromRows(admins);
    }

    // ---------------- PROFILES ----------------
    let profilesCache = [];
    let profileSearchTerm = '';

    async function renderProfiles(view) {
      if (profilesCache.length === 0) {
        profilesCache = await getProfiles();
      }
      if (!profilesCache || profilesCache.length === 0) {
        view.innerHTML = '<h2>Profiles</h2><p class="small">No users yet.</p>';
        return;
      }

      let html = `
        <h2>Profiles</h2>
        <div class="search-bar">
          <input id="profileSearch" type="search" placeholder="Search name, phone, email…" value="${escapeAttr(profileSearchTerm)}">
        </div>
        <div id="profilesList"></div>
      `;
      view.innerHTML = html;

      document.getElementById('profileSearch').addEventListener('input', (e) => {
        profileSearchTerm = e.target.value.toLowerCase();
        renderProfilesList(view);
      });

      renderProfilesList(view);
    }

    function renderProfilesList(view) {
      const container = document.getElementById('profilesList');
      const filtered = profilesCache.filter(p => {
        if (!profileSearchTerm) return true;
        const term = profileSearchTerm;
        return (p.full_name || '').toLowerCase().includes(term) ||
               (p.phone || '').toLowerCase().includes(term) ||
               (p.email || '').toLowerCase().includes(term) ||
               (p.county || '').toLowerCase().includes(term);
      });

      if (!filtered.length) {
        container.innerHTML = '<p class="small">No profiles match your search.</p>';
        return;
      }

      let html = '';
      filtered.forEach(p => {
        const name = escapeHtml(p.full_name || p.user_name || '(no name)');
        const rolesArr = Array.isArray(p.roles) ? p.roles : [];
        const rolesText = rolesArr.join(', ');
        const locParts = [p.town, p.ward, p.sub_county, p.county, p.region, p.country].filter(Boolean);
        const loc = locParts.length ? locParts.join(', ') : '—';

        html += `
          <div class="profile-card" data-pid="${p.id}">
            <div class="profile-head">
              <strong>${name}</strong>
              ${p.is_verified ? '<span class="badge badge-ok">verified</span>' : '<span class="badge">unverified</span>'}
              ${p.is_blocked ? '<span class="badge badge-bad">blocked</span>' : ''}
              ${!p.is_active ? '<span class="badge badge-warn">inactive</span>' : ''}
            </div>
            <div class="small">${escapeHtml(p.phone || '')} · ${escapeHtml(p.email || '')}</div>
            <div class="location-line">Location: <strong>${escapeHtml(loc)}</strong></div>
            <div class="small">Roles: ${escapeHtml(rolesText)}</div>
            <div class="profile-actions">
              <button class="btn-sm" data-action="edit" data-id="${p.id}">Edit</button>
              <button class="btn-sm" data-action="verify" data-id="${p.id}" data-value="${!p.is_verified}">${p.is_verified ? 'Unverify' : 'Verify'}</button>
              <button class="btn-sm" data-action="activate" data-id="${p.id}" data-value="${!p.is_active}">${p.is_active ? 'Deactivate' : 'Activate'}</button>
              <button class="btn-sm ${p.is_blocked ? '' : 'btn-danger'}" data-action="block" data-id="${p.id}" data-value="${!p.is_blocked}">${p.is_blocked ? 'Unblock' : 'Block'}</button>
            </div>

            <div class="edit-form" id="edit-${p.id}">
              <label>Full name</label><input id="f_name_${p.id}" value="${escapeHtml(p.full_name || '')}">
              <label>Phone</label><input id="f_phone_${p.id}" value="${escapeHtml(p.phone || '')}">
              <label>Email</label><input id="f_email_${p.id}" value="${escapeHtml(p.email || '')}">
              <label>Country</label><input id="f_country_${p.id}" value="${escapeHtml(p.country || '')}">
              <label>Region / State</label><input id="f_region_${p.id}" value="${escapeHtml(p.region || '')}">
              <label>County / District</label><input id="f_county_${p.id}" value="${escapeHtml(p.county || '')}">
              <label>Sub-county</label><input id="f_sub_county_${p.id}" value="${escapeHtml(p.sub_county || '')}">
              <label>Ward</label><input id="f_ward_${p.id}" value="${escapeHtml(p.ward || '')}">
              <label>Town</label><input id="f_town_${p.id}" value="${escapeHtml(p.town || '')}">
              <label>Roles</label>
              <div class="role-box">
                ${ALL_ROLES.map(r => `
                  <div class="role-row">
                    <input type="checkbox" id="r_${p.id}_${r.v}" value="${r.v}" ${rolesArr.includes(r.v) ? 'checked' : ''}>
                    <label for="r_${p.id}_${r.v}">${r.l}</label>
                  </div>
                `).join('')}
              </div>
              <div class="edit-actions">
                <button type="button" class="btn-cancel" data-action="cancel-edit" data-id="${p.id}">Cancel</button>
                <button type="button" class="btn-save" data-action="save-edit" data-id="${p.id}">Save changes</button>
              </div>
              <p class="edit-msg" id="msg_${p.id}"></p>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;

      container.querySelectorAll('button[data-action]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.id;
          const action = btn.dataset.action;
          const value = btn.dataset.value === 'true';

          if (action === 'edit') {
            document.getElementById('edit-' + id).classList.toggle('show');
            return;
          }
          if (action === 'cancel-edit') {
            document.getElementById('edit-' + id).classList.remove('show');
            return;
          }
          if (action === 'save-edit') {
            const msg = document.getElementById('msg_' + id);
            msg.className = 'edit-msg'; msg.textContent = '';
            btn.disabled = true;

            const selectedRoles = [];
            ALL_ROLES.forEach(r => {
              if (document.getElementById('r_' + id + '_' + r.v).checked) selectedRoles.push(r.v);
            });
            if (!selectedRoles.length) {
              msg.className = 'edit-msg error'; msg.textContent = 'Tick at least one role.'; btn.disabled = false; return;
            }

            const updates = {
              full_name:  document.getElementById('f_name_' + id).value.trim(),
              phone:      document.getElementById('f_phone_' + id).value.trim() || null,
              email:      document.getElementById('f_email_' + id).value.trim() || null,
              country:    document.getElementById('f_country_' + id).value.trim() || null,
              region:     document.getElementById('f_region_' + id).value.trim() || null,
              county:     document.getElementById('f_county_' + id).value.trim() || null,
              sub_county: document.getElementById('f_sub_county_' + id).value.trim() || null,
              ward:       document.getElementById('f_ward_' + id).value.trim() || null,
              town:       document.getElementById('f_town_' + id).value.trim() || null,
              roles:      selectedRoles
            };

            try {
              await updateProfile(id, updates);
              msg.className = 'edit-msg ok'; msg.textContent = '✅ Saved.';
              profilesCache = await getProfiles();
              setTimeout(() => renderProfilesList(view), 500);
            } catch (err) {
              msg.className = 'edit-msg error'; msg.textContent = '❌ ' + (err.message || 'Failed');
              btn.disabled = false;
            }
            return;
          }

          btn.disabled = true; btn.textContent = '…';
          try {
            if (action === 'verify')   await updateProfile(id, { is_verified: value });
            if (action === 'activate') await updateProfile(id, { is_active: value });
            if (action === 'block')    await updateProfile(id, { is_blocked: value });
            profilesCache = await getProfiles();
            renderProfilesList(view);
          } catch (err) { alert('Error: ' + (err.message || 'Failed')); btn.disabled = false; }
        });
      });
    }

    // ---------------- PRODUCTS ----------------
    let productsCache = [];
    let productSearchTerm = '';

    async function renderProducts(view) {
      if (productsCache.length === 0) {
        productsCache = await getProducts();
      }
      if (!productsCache || productsCache.length === 0) {
        view.innerHTML = '<h2>Products</h2><p class="small">No products yet.</p>'; return;
      }

      let html = `
        <h2>Products</h2>
        <div class="search-bar">
          <input id="productSearch" type="search" placeholder="Search title, seller, location…" value="${escapeAttr(productSearchTerm)}">
        </div>
        <div id="productsList"></div>
      `;
      view.innerHTML = html;

      document.getElementById('productSearch').addEventListener('input', (e) => {
        productSearchTerm = e.target.value.toLowerCase();
        renderProductsList(view);
      });

      renderProductsList(view);
    }

    function renderProductsList(view) {
      const container = document.getElementById('productsList');
      const filtered = productsCache.filter(p => {
        if (!productSearchTerm) return true;
        const term = productSearchTerm;
        return (p.title || '').toLowerCase().includes(term) ||
               (p.seller_name || '').toLowerCase().includes(term) ||
               (p.county || '').toLowerCase().includes(term) ||
               (p.category || '').toLowerCase().includes(term);
      });

      if (!filtered.length) {
        container.innerHTML = '<p class="small">No products match your search.</p>';
        return;
      }

      let html = '';
      filtered.forEach(p => {
        const title = escapeHtml(p.title || '(untitled)');
        const price = (p.currency || 'KES') + ' ' + (p.price ?? 0);
        const loc = [p.location, p.ward, p.sub_county, p.county].filter(Boolean).join(', ') || '—';
        html += `
          <div class="profile-card">
            <div class="profile-head">
              <strong>${title}</strong>
              <span class="badge">${escapeHtml(p.status || 'active')}</span>
              ${p.is_featured ? '<span class="badge badge-ok">featured</span>' : ''}
            </div>
            <div class="small">${escapeHtml(price)} · ${p.quantity} ${escapeHtml(p.unit || '')}</div>
            <div class="small">Seller: ${escapeHtml(p.seller_name || '—')} ${escapeHtml(p.seller_phone || '')}</div>
            <div class="location-line">Location: <strong>${escapeHtml(loc)}</strong></div>
            <div class="profile-actions">
              <button class="btn-sm" data-action="feature" data-id="${p.id}" data-value="${!p.is_featured}">${p.is_featured ? 'Unfeature' : 'Feature'}</button>
              <button class="btn-sm" data-action="archive" data-id="${p.id}">Archive</button>
              <button class="btn-sm btn-danger" data-action="block" data-id="${p.id}">Block</button>
              <button class="btn-sm btn-danger" data-action="delete" data-id="${p.id}">Delete</button>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;

      container.querySelectorAll('button[data-action]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.id;
          const value = btn.dataset.value === 'true';
          const action = btn.dataset.action;
          btn.disabled = true; btn.textContent = '…';
          try {
            if (action === 'feature') await updateProduct(id, { is_featured: value });
            if (action === 'archive') await updateProduct(id, { status: 'archived' });
            if (action === 'block')   await updateProduct(id, { status: 'blocked' });
            if (action === 'delete') {
              if (!confirm('Delete this product permanently?')) { btn.disabled = false; return renderProductsList(view); }
              await deleteProduct(id);
            }
            productsCache = await getProducts();
            renderProductsList(view);
          } catch (err) { alert('Error: ' + (err.message || 'Failed')); btn.disabled = false; }
        });
      });
    }

    // ---------------- LISTINGS ----------------
    let listingsCache = [];
    let listingSearchTerm = '';

    async function renderListings(view) {
      if (listingsCache.length === 0) {
        listingsCache = await getAdminListings();
      }
      if (!listingsCache || listingsCache.length === 0) {
        view.innerHTML = '<h2>Listings</h2><p class="small">No listings yet.</p>'; return;
      }

      let html = `
        <h2>Listings</h2>
        <div class="search-bar">
          <input id="listingSearch" type="search" placeholder="Search title, seller, type…" value="${escapeAttr(listingSearchTerm)}">
        </div>
        <div id="listingsList"></div>
      `;
      view.innerHTML = html;

      document.getElementById('listingSearch').addEventListener('input', (e) => {
        listingSearchTerm = e.target.value.toLowerCase();
        renderListingsList(view);
      });

      renderListingsList(view);
    }

    function renderListingsList(view) {
      const container = document.getElementById('listingsList');
      const filtered = listingsCache.filter(p => {
        if (!listingSearchTerm) return true;
        const term = listingSearchTerm;
        return (p.title || '').toLowerCase().includes(term) ||
               (p.seller_name || '').toLowerCase().includes(term) ||
               (p.type || '').toLowerCase().includes(term);
      });

      if (!filtered.length) {
        container.innerHTML = '<p class="small">No listings match your search.</p>';
        return;
      }

      let html = '';
      filtered.forEach(p => {
        const title = escapeHtml(p.title || '(untitled)');
        const price = (p.currency || 'KES') + ' ' + (p.price ?? 0);
        const loc = [p.location, p.ward, p.sub_county, p.county].filter(Boolean).join(', ') || '—';
        html += `
          <div class="profile-card">
            <div class="profile-head">
              <strong>${title}</strong>
              <span class="badge">${escapeHtml(p.type || '')}</span>
              <span class="badge">${escapeHtml(p.status || 'active')}</span>
            </div>
            <div class="small">${escapeHtml(price)} · ${p.quantity} ${escapeHtml(p.unit || '')}</div>
            <div class="small">Seller: ${escapeHtml(p.seller_name || '—')} ${escapeHtml(p.seller_phone || '')}</div>
            <div class="location-line">Location: <strong>${escapeHtml(loc)}</strong></div>
            <div class="profile-actions">
              <button class="btn-sm" data-action="feature" data-id="${p.id}" data-value="${!p.is_featured}">${p.is_featured ? 'Unfeature' : 'Feature'}</button>
              <button class="btn-sm" data-action="archive" data-id="${p.id}">Archive</button>
              <button class="btn-sm btn-danger" data-action="block" data-id="${p.id}">Block</button>
              <button class="btn-sm btn-danger" data-action="delete" data-id="${p.id}">Delete</button>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;

      container.querySelectorAll('button[data-action]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.id;
          const value = btn.dataset.value === 'true';
          const action = btn.dataset.action;
          btn.disabled = true; btn.textContent = '…';
          try {
            if (action === 'feature') await updateListing(id, { is_featured: value });
            if (action === 'archive') await updateListing(id, { status: 'archived' });
            if (action === 'block')   await updateListing(id, { status: 'blocked' });
            if (action === 'delete') {
              if (!confirm('Delete this listing permanently?')) { btn.disabled = false; return renderListingsList(view); }
              await deleteListing(id);
            }
            listingsCache = await getAdminListings();
            renderListingsList(view);
          } catch (err) { alert('Error: ' + (err.message || 'Failed')); btn.disabled = false; }
        });
      });
    }

    // ---------------- REPORTS ----------------
    let reportsShowOnlyOpen = false;

    function reportTargetKind(target_type) {
      const t = String(target_type || '').toLowerCase();
      if (t === 'product' || t === 'products') return 'product';
      if (t === 'listing' || t === 'listings' || t === 'service' || t === 'job') return 'listing';
      if (t === 'profile' || t === 'user' || t === 'users' || t === 'account') return 'profile';
      return null;
    }

    async function renderReports(view) {
      const reports = await getReports();
      if (!reports || reports.length === 0) {
        view.innerHTML = '<h2>Reports</h2><p class="small">No reports yet.</p>'; return;
      }

      const openCount = reports.filter(r => r.status === 'open').length;

      let html = `
        <h2>Reports</h2>
        <div style="display:flex; gap:8px; margin-bottom:12px; align-items:center; flex-wrap:wrap;">
          <button id="reportsFilterBtn" class="btn-sm ${reportsShowOnlyOpen ? 'btn-danger' : ''}">
            ${reportsShowOnlyOpen ? '🔒 Showing open only — tap to show all' : '👁 Showing all — tap to show open only'}
          </button>
          <span class="small">${openCount} open · ${reports.length} total</span>
        </div>
      `;

      const visibleReports = reportsShowOnlyOpen
        ? reports.filter(r => r.status === 'open')
        : reports;

      if (visibleReports.length === 0) {
        html += '<p class="small">No open reports. 🎉</p>';
      }

      visibleReports.forEach(r => {
        const when = r.created_at ? new Date(r.created_at).toLocaleString() : '';
        const kind = reportTargetKind(r.target_type);
        const isOpen = r.status === 'open';

        // Context-aware quick actions (only shown for open reports we know how to route)
        let quickActions = '';
        if (isOpen && kind === 'product') {
          quickActions = `
            <button class="btn-sm btn-danger" data-action="block-target" data-id="${r.id}" data-kind="product" data-target="${r.target_id}">🚫 Block Product</button>
            <button class="btn-sm btn-danger" data-action="delete-target" data-id="${r.id}" data-kind="product" data-target="${r.target_id}">🗑 Delete Product</button>
          `;
        } else if (isOpen && kind === 'listing') {
          quickActions = `
            <button class="btn-sm btn-danger" data-action="block-target" data-id="${r.id}" data-kind="listing" data-target="${r.target_id}">🚫 Block Listing</button>
            <button class="btn-sm btn-danger" data-action="delete-target" data-id="${r.id}" data-kind="listing" data-target="${r.target_id}">🗑 Delete Listing</button>
          `;
        } else if (isOpen && kind === 'profile') {
          quickActions = `
            <button class="btn-sm btn-danger" data-action="block-target" data-id="${r.id}" data-kind="profile" data-target="${r.target_id}">🚫 Block User</button>
          `;
        }

        html += `
          <div class="profile-card">
            <div class="profile-head">
              <strong>${escapeHtml(r.target_type)}</strong>
              <span class="badge ${r.status === 'open' ? 'badge-warn' : r.status === 'resolved' ? 'badge-ok' : ''}">${escapeHtml(r.status)}</span>
            </div>
            <div class="small">Reason: ${escapeHtml(r.reason)}</div>
            ${r.details ? '<div class="small">Details: ' + escapeHtml(r.details) + '</div>' : ''}
            <div class="small">Target ID: <code>${escapeHtml(r.target_id)}</code></div>
            <div class="small">Reported: ${escapeHtml(when)}</div>
            ${r.admin_note ? '<div class="small" style="color:#146c34;">Admin note: ' + escapeHtml(r.admin_note) + '</div>' : ''}
            ${r.status !== 'open' && r.resolved_at
              ? '<div class="small">Closed: ' + escapeHtml(new Date(r.resolved_at).toLocaleString()) + '</div>'
              : ''}
            <div class="profile-actions">
              ${quickActions}
              ${r.status === 'open'
                ? `<button class="btn-sm" data-action="resolve" data-id="${r.id}">Resolve</button>
                   <button class="btn-sm" data-action="dismiss" data-id="${r.id}">Dismiss</button>`
                : `<button class="btn-sm" data-action="reopen" data-id="${r.id}">↩ Reopen</button>`}
              <button class="btn-sm btn-danger" data-action="delete" data-id="${r.id}">Delete</button>
            </div>
          </div>
        `;
      });

      view.innerHTML = html;

      const filterBtn = view.querySelector('#reportsFilterBtn');
      if (filterBtn) filterBtn.addEventListener('click', () => {
        reportsShowOnlyOpen = !reportsShowOnlyOpen;
        renderReports(view);
      });

      view.querySelectorAll('button[data-action]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.id;
          const action = btn.dataset.action;

          // ---- Quick actions that hit the target AND auto-resolve the report ----
          if (action === 'block-target' || action === 'delete-target') {
            const kind = btn.dataset.kind;
            const targetId = btn.dataset.target;

            const verb = action === 'delete-target' ? 'Delete' : 'Block';
            const label = kind === 'product' ? 'product' : kind === 'listing' ? 'listing' : 'user';
            if (!confirm(`${verb} this ${label} permanently? This will also resolve the report.`)) return;

            btn.disabled = true; btn.textContent = '…';
            try {
              if (kind === 'product') {
                if (action === 'delete-target') await deleteProduct(targetId);
                else await updateProduct(targetId, { status: 'blocked' });
              } else if (kind === 'listing') {
                if (action === 'delete-target') await deleteListing(targetId);
                else await updateListing(targetId, { status: 'blocked' });
              } else if (kind === 'profile') {
                await updateProfile(targetId, { is_blocked: true });
              }

              const note = 'Actioned: ' +
                           (kind === 'product' ? 'product' : kind === 'listing' ? 'listing' : 'user') +
                           (action === 'delete-target' ? ' deleted' : ' blocked');
              await updateReport(id, { status: 'resolved', admin_note: note });

              // Bust caches so other views reflect the change
              productsCache = [];
              listingsCache = [];
              profilesCache = [];

              await renderReports(view);
            } catch (err) {
              alert('Error: ' + (err.message || 'Failed'));
              btn.disabled = false;
            }
            return;
          }

          // ---- Existing behaviour ----
          btn.disabled = true; btn.textContent = '…';
          try {
            if (action === 'resolve') await updateReport(id, { status: 'resolved' });
            if (action === 'dismiss') await updateReport(id, { status: 'dismissed' });
            if (action === 'reopen')  await updateReport(id, { status: 'open', admin_note: null });
            if (action === 'delete') {
              if (!confirm('Delete this report?')) { btn.disabled = false; return renderReports(view); }
              await db.from('reports').delete().eq('id', id);
            }
            await renderReports(view);
          } catch (err) { alert('Error: ' + (err.message || 'Failed')); btn.disabled = false; }
        });
      });
    }

    // ---------------- ADS ----------------
    async function renderAds(view) {
      const ads = await getAds();
      let html = '<h2>Webpage Advertisements</h2>';

      html += `
        <details style="margin-bottom:12px;">
          <summary style="cursor:pointer; font-weight:600; color:#1e7a3c;">+ Create new ad</summary>
          <form id="adCreateForm" style="margin-top:10px;">
            <label>Title</label>
            <input id="ad_title" required placeholder="e.g. Fresh Harvest Season!">
            <label>Description</label>
            <input id="ad_description" placeholder="Optional short line">
            <label>Photo</label>
            <div class="photo-pick" id="adPhotoBox">
              <div id="adPhotoLabel">📷  Tap to choose a photo or video</div>
              <input type="file" id="adPhotoInput" accept="image/*,video/mp4,video/webm,video/quicktime">
            </div>
            <img id="adPhotoPreview" class="ad-thumb" style="display:none;">
            <video id="adVideoPreview" class="ad-thumb" style="display:none;" controls muted></video>

            <label>Link destination</label>
            <div class="file-pick" id="adFileBox">
              <div id="adFileLabel">📎  Choose a file from device (PDF, image, doc…)</div>
              <input type="file" id="adFileInput">
            </div>
            <p class="hint" id="adFileHint">Uploads to AgriLink storage and becomes the ad link.</p>
            <div class="or-sep">— OR paste a URL below —</div>
            <input id="ad_link_url" placeholder="https://wa.me/254…  or  https://example.com">

            <label>Position</label>
            <select id="ad_position">
              <option value="home_top">Home — top</option>
              <option value="home_middle">Home — middle</option>
              <option value="home_bottom">Home — bottom</option>
            </select>

            <label>Sort order (lower = first)</label>
            <input id="ad_sort_order" type="number" value="0">

            <button type="submit" id="adCreateBtn">Create ad</button>
            <p id="adCreateMsg" class="small"></p>
          </form>
        </details>
      `;

      if (!ads || ads.length === 0) {
        html += '<p class="small">No advertisements yet.</p>';
        view.innerHTML = html;
        attachAdCreate(view);
        return;
      }

      ads.forEach(a => {
        const isVideo = /\.(mp4|webm|mov|m4v|ogg)(\?.*)?$/i.test(a.image_url || '');
        const media = a.image_url
          ? (isVideo
              ? '<video src="' + escapeHtml(a.image_url) + '" class="ad-thumb" controls muted></video>'
              : '<img class="ad-thumb" src="' + escapeHtml(a.image_url) + '" alt="">')
          : '';

        html += `
          <div class="profile-card">
            <div class="profile-head">
              <strong>${escapeHtml(a.title || '(untitled)')}</strong>
              <span class="badge">${escapeHtml(a.position)}</span>
              ${a.is_active ? '<span class="badge badge-ok">active</span>' : '<span class="badge badge-warn">inactive</span>'}
            </div>
            ${a.description ? '<div class="small">' + escapeHtml(a.description) + '</div>' : ''}
            ${media}
            ${a.link_url ? '<div class="small" style="word-break:break-all;">Link: ' + escapeHtml(a.link_url) + '</div>' : ''}
            <div class="small">Sort: ${a.sort_order ?? 0}</div>
            <div class="profile-actions">
              <button class="btn-sm" data-ad-action="toggle" data-id="${a.id}" data-value="${!a.is_active}">
                ${a.is_active ? 'Deactivate' : 'Activate'}
              </button>
              <button class="btn-sm btn-danger" data-ad-action="delete" data-id="${a.id}">Delete</button>
            </div>
          </div>
        `;
      });

      view.innerHTML = html;

      view.querySelectorAll('button[data-ad-action]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.id;
          const action = btn.dataset.adAction;
          const value = btn.dataset.value === 'true';
          btn.disabled = true; btn.textContent = '…';
          try {
            if (action === 'toggle') await updateAd(id, { is_active: value });
            if (action === 'delete') {
              if (!confirm('Delete this ad?')) { btn.disabled = false; return renderAds(view); }
              await deleteAd(id);
            }
            await renderAds(view);
          } catch (err) { alert('Error: ' + (err.message || 'Failed')); btn.disabled = false; }
        });
      });

      attachAdCreate(view);
    }

    function attachAdCreate(view) {
      const form = view.querySelector('#adCreateForm');
      if (!form) return;

      let pickedPhoto = null;
      let pickedFile  = null;

      const photoBox     = view.querySelector('#adPhotoBox');
      const photoInput   = view.querySelector('#adPhotoInput');
      const photoLabel   = view.querySelector('#adPhotoLabel');
      const photoPreview = view.querySelector('#adPhotoPreview');
      const videoPreview = view.querySelector('#adVideoPreview');

      const fileBox   = view.querySelector('#adFileBox');
      const fileInput = view.querySelector('#adFileInput');
      const fileLabel = view.querySelector('#adFileLabel');
      const fileHint  = view.querySelector('#adFileHint');
      const linkInput = view.querySelector('#ad_link_url');

      photoBox.addEventListener('click', () => photoInput.click());
      photoInput.addEventListener('change', (e) => {
        const f = e.target.files[0];
        if (!f) return;
        pickedPhoto = f;
        photoLabel.textContent = '📷  ' + f.name;
        const isVid = f.type.startsWith('video/') || /\.(mp4|webm|mov|m4v|ogg)$/i.test(f.name);
        if (isVid) {
          photoPreview.style.display = 'none';
          videoPreview.src = URL.createObjectURL(f);
          videoPreview.style.display = 'block';
        } else {
          videoPreview.style.display = 'none';
          videoPreview.src = '';
          photoPreview.src = URL.createObjectURL(f);
          photoPreview.style.display = 'block';
        }
        photoBox.classList.add('has-file');
      });

      fileBox.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => {
        const f = e.target.files[0];
        if (!f) return;
        pickedFile = f;
        fileLabel.textContent = '📎  ' + f.name + '  (' + (f.size / 1024).toFixed(0) + ' KB)';
        fileBox.classList.add('has-file');
        fileHint.textContent = 'This file will be uploaded and become the ad link.';
        linkInput.value = '';
      });

      linkInput.addEventListener('input', () => {
        if (linkInput.value.trim().length > 0) {
          pickedFile = null;
          fileInput.value = '';
          fileLabel.textContent = '📎  Choose a file from device (PDF, image, doc…)';
          fileBox.classList.remove('has-file');
          fileHint.textContent = 'URL typed above will be used as the link.';
        }
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = view.querySelector('#adCreateMsg');
        const btn = view.querySelector('#adCreateBtn');
        msg.textContent = ''; btn.disabled = true;

        try {
          let image_url = null;
          if (pickedPhoto) {
            btn.textContent = 'Uploading media…';
            image_url = await uploadAdAsset(pickedPhoto, 'webad-media');
          }

          let link_url = linkInput.value.trim();
          if (pickedFile) {
            btn.textContent = 'Uploading file…';
            link_url = await uploadAdAsset(pickedFile, 'webad-file');
          }

          if (!link_url) {
            throw new Error('Please choose a file or paste a URL for the link.');
          }

          btn.textContent = 'Creating…';
          await createAd({
            title: document.getElementById('ad_title').value.trim(),
            description: document.getElementById('ad_description').value.trim() || null,
            image_url: image_url,
            link_url: link_url,
            position: document.getElementById('ad_position').value,
            sort_order: Number(document.getElementById('ad_sort_order').value) || 0,
            is_active: true
          });
          await renderAds(view);
        } catch (err) {
          msg.textContent = '❌ ' + (err.message || 'Failed');
          btn.disabled = false;
          btn.textContent = 'Create ad';
        }
      });
    }

    // ---------------- HELPERS ----------------
    function tableFromRows(rows) {
      if (!rows || rows.length === 0) return '<p class="small">No rows.</p>';
      const cols = Object.keys(rows[0]);
      let html = '<table><thead><tr>';
      cols.forEach(c => html += '<th>' + escapeHtml(c) + '</th>');
      html += '</tr></thead><tbody>';
      rows.forEach(r => {
        html += '<tr>';
        cols.forEach(c => {
          let v = r[c];
          if (v === null || v === undefined) v = '';
          if (typeof v === 'object') v = JSON.stringify(v);
          html += '<td>' + escapeHtml(v) + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      return html;
    }

    function escapeAttr(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;');
    }

    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    init();
  </script>
</body>
</html>
