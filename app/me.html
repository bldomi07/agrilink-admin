<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My account — AgriLink</title>
  <link rel="stylesheet" href="app.css" />
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e7a3c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AgriLink">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .wrap { max-width: 640px; margin: 12px auto; padding: 0 12px; }
    .card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .who { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .who h1 { margin: 0 0 4px; font-size: 20px; color: #1c1c1c; }
    .who .meta { color: #666; font-size: 13px; margin: 2px 0; }
    .logout-btn { background: #fff; color: #b00020; border: 1px solid #b00020; padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: #1e7a3c; color: #fff; text-decoration: none; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 700; border: 0; cursor: pointer; }
    .btn-outline { background: #fff; color: #1e7a3c; border: 1px solid #1e7a3c; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .roles-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .role-badge { background: #e8f3ec; color: #1e7a3c; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
    .edit-form { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid #eee; }
    .edit-form.show { display: block; }
    .edit-form label { display: block; margin-top: 12px; font-size: 13px; color: #333; font-weight: 600; }
    .edit-form input, .edit-form select { width: 100%; padding: 12px; font-size: 16px; margin-top: 6px; border: 1px solid #cfd8d2; border-radius: 10px; background: #fbfdfb; font-family: inherit; }
    .edit-form textarea { width: 100%; padding: 12px; font-size: 16px; margin-top: 6px; border: 1px solid #cfd8d2; border-radius: 10px; background: #fbfdfb; font-family: inherit; min-height: 70px; resize: vertical; }
    .role-box { margin-top: 6px; border: 1px solid #cfd8d2; border-radius: 10px; padding: 4px 12px; background: #fbfdfb; }
    .role-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eef3ef; }
    .role-row:last-child { border-bottom: 0; }
    .role-row input[type=checkbox] { width: 20px; height: 20px; margin: 0; accent-color: #1e7a3c; }
    .role-row label { margin: 0; font-weight: 500; font-size: 15px; color: #1c1c1c; flex: 1; cursor: pointer; }
    .edit-actions { display: flex; gap: 8px; margin-top: 16px; }
    .edit-actions button { flex: 1; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; border: 0; }
    .btn-save { background: #1e7a3c; color: #fff; }
    .btn-save:disabled { opacity: 0.6; }
    .btn-cancel { background: #eee; color: #333; }
    .edit-msg { margin-top: 10px; font-size: 13px; text-align: center; min-height: 16px; }
    .edit-msg.ok    { color: #146c34; }
    .edit-msg.error { color: #b00020; }
    .edit-msg.info  { color: #1e7a3c; }
    .row { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eee; }
    .row:last-child { border-bottom: 0; }
    .row-img { width: 68px; height: 68px; border-radius: 10px; background: #eef3ef; flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 28px; color: #a8bfb0; }
    .row-img img { width: 100%; height: 100%; object-fit: cover; }
    .row-body { flex: 1; min-width: 0; }
    .row-title { font-size: 15px; font-weight: 600; margin: 0 0 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-price { color: #1e7a3c; font-weight: 700; font-size: 14px; }
    .row-meta { color: #777; font-size: 12px; margin-top: 2px; }
    .row-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .row-actions a, .row-actions button { font-size: 12px; padding: 6px 10px; border-radius: 6px; cursor: pointer; text-decoration: none; border: 1px solid #1e7a3c; background: #fff; color: #1e7a3c; font-weight: 600; }
    .row-actions .danger { color: #b00020; border-color: #b00020; }
    .type-tag { display: inline-block; background: #f1f5f2; color: #666; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-right: 4px; text-transform: uppercase; }
    .status-badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; margin-left: 6px; vertical-align: middle; }
    .status-active { background: #d6f5e0; color: #146c34; }
    .status-sold   { background: #eee; color: #666; }
    .status-archived { background: #fef0d5; color: #7a4d00; }
    .status-blocked { background: #ffd9dd; color: #8a0016; }
    .empty { text-align: center; padding: 30px 10px; color: #777; font-size: 14px; }
    .loading { text-align: center; padding: 40px; color: #777; }
    .error { color: #b00020; text-align: center; padding: 20px; font-size: 14px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; }
    .tab-btn { padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; background: #f1f5f2; color: #555; border: 0; cursor: pointer; white-space: nowrap; }
    .tab-btn.active { background: #1e7a3c; color: #fff; }
    .hidden { display: none; }
    .listing-edit { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #dfe6e1; }
    .listing-edit.show { display: block; }
    .listing-edit label { display: block; margin-top: 10px; font-size: 12px; font-weight: 600; color: #333; }
    .listing-edit input, .listing-edit select, .listing-edit textarea {
      width: 100%; padding: 10px; font-size: 14px; margin-top: 4px;
      border: 1px solid #cfd8d2; border-radius: 8px; background: #fbfdfb; font-family: inherit;
    }
    .listing-edit textarea { min-height: 60px; resize: vertical; }
    .listing-edit .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .photo-pick {
      margin-top: 6px; border: 2px dashed #cfd8d2; border-radius: 10px;
      padding: 12px; text-align: center; background: #fbfdfb;
      cursor: pointer; font-size: 13px; color: #555;
    }
    .photo-pick.has-file { border-color: #1e7a3c; background: #e8f3ec; color: #146c34; font-weight: 600; }
    .photo-pick input[type=file] { display: none; }
    .photo-preview { margin-top: 8px; max-width: 100%; max-height: 140px; border-radius: 8px; display: none; }
    .photo-preview.show { display: block; }
    .current-photo { margin-top: 8px; max-width: 100%; max-height: 140px; border-radius: 8px; display: block; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="logo">
      <span class="logo-icon">🚜</span>
      <span class="logo-text">AgriLink</span>
    </div>
    <a href="index.html" class="login-btn">Browse</a>
  </header>

  <main class="wrap" id="content">
    <p class="loading">Loading…</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="locations.js"></script>
  <script src="supabase.js"></script>
  <script>
    const ALL_ROLES = [
      { v: 'farmer', l: 'Farmer' },{ v: 'buyer', l: 'Buyer' },{ v: 'seller', l: 'Seller' },
      { v: 'service_provider', l: 'Service Provider' },{ v: 'job_seeker', l: 'Job Seeker' },
      { v: 'transport_provider', l: 'Transport Provider' },{ v: 'machinery_provider', l: 'Machinery Provider' }
    ];

    const TITLE_OPTIONS = {
      product: ['Maize','Beans','Rice','Wheat','Sorghum','Millet','Green grams (Ndengu)','Groundnuts','Potatoes','Sweet potatoes','Cassava','Tomatoes','Onions','Cabbage','Kale (Sukuma wiki)','Spinach','Carrots','Peas','Bananas','Avocado','Mangoes','Oranges','Pineapples','Watermelons','Pawpaw','Passion fruit','Cow','Bull','Heifer','Calf','Goat','Sheep','Ram','Pig','Sow','Rabbit','Donkey','Chicken (broilers)','Chicken (layers)','Cockerel','Hen','Duck','Turkey','Guinea fowl','Goose','Milk','Yoghurt','Cheese','Eggs','Maize seed','Bean seed','Vegetable seedlings','Fruit seedlings','Tree seedlings','Honey','Coffee','Tea','Macadamia','Sunflower','Fish','Fish fingerlings'],
      service: ['Transport / Delivery','Ploughing','Planting','Weeding','Harvesting','Spraying / Pest control','Veterinary services','Artificial insemination (AI)','Extension / Advisory','Soil testing','Irrigation setup','Fencing','Welding / Repairs','Land clearing','Farm labour'],
      job: ['Farm worker','Herdsman','Driver','Machine operator','Security guard','Sales person','Cook','House help'],
      machinery: ['Tractor','Plough','Harrow','Planter','Harvester','Trailer','Water pump','Irrigation kit','Milking machine','Chaff cutter','Maize mill','Generator','Sprayer'],
      farm: ['Farmland for sale','Farmland for lease','Farmland for rent','Ranch','Plot','Greenhouse','Poultry house','Fish pond']
    };

    const CATEGORY_OPTIONS = [
      { v: '', l: '— choose —' },
      { v: 'grain', l: 'Grain' },{ v: 'vegetable', l: 'Vegetables' },{ v: 'fruit', l: 'Fruits' },
      { v: 'livestock', l: 'Livestock' },{ v: 'dairy', l: 'Dairy' },{ v: 'poultry', l: 'Poultry' },
      { v: 'seed', l: 'Seeds' },{ v: 'other', l: 'Other' }
    ];

    let myProfile = null, myProducts = [], myListings = [];
    let activeTab = 'products';
    let keCounties = null, afProvinces = null;
    let editingListingId = null;
    let editingKind = null;
    let editingImageFile = null;
    let editingExistingImage = null;

    document.addEventListener('DOMContentLoaded', init);

    async function init() {
      const content = document.getElementById('content');
      try {
        const session = await getSession();
        if (!session) { window.location.href = 'login.html'; return; }
        myProfile = await getMyProfile();
        myProducts = await getMyProducts();
        myListings = await getMyListings();
        content.innerHTML = renderPage();
        attachHandlers();
      } catch (err) {
        content.innerHTML = '<p class="error">Failed to load: ' + escapeHtml(err.message) + '</p>';
      }
    }

    function renderPage() {
      const name = myProfile && myProfile.full_name ? myProfile.full_name : 'AgriLink user';
      const phone = myProfile && myProfile.phone ? myProfile.phone : '';
      const roles = (myProfile && Array.isArray(myProfile.roles)) ? myProfile.roles : [];

      const locParts = [
        myProfile && myProfile.town,
        myProfile && myProfile.ward,
        myProfile && myProfile.sub_county,
        myProfile && myProfile.county,
        myProfile && myProfile.region,
        myProfile && myProfile.country
      ].filter(Boolean);
      const locLine = locParts.length ? locParts.join(', ') : '';

      const roleBadges = roles.length
        ? '<div class="roles-list">' + roles.map(r => {
            const label = (ALL_ROLES.find(x => x.v === r) || { l: r }).l;
            return '<span class="role-badge">' + escapeHtml(label) + '</span>';
          }).join('') + '</div>'
        : '<div class="meta">No roles set</div>';

      return `
        <div class="card">
          <div class="who">
            <div>
              <h1>${escapeHtml(name)}</h1>
              ${phone ? '<p class="meta">' + escapeHtml(phone) + '</p>' : ''}
              ${locLine ? '<p class="meta">' + escapeHtml(locLine) + '</p>' : ''}
            </div>
            <button class="logout-btn" id="logoutBtn">Log out</button>
          </div>
          ${roleBadges}
          <div style="margin-top: 14px;">
            <button class="btn-outline" id="editProfileBtn">Edit profile</button>
          </div>

          <div class="edit-form" id="profileEditForm">
            <form id="profileForm">
              <label>Full name</label>
              <input id="edit_full_name" type="text" required value="${escapeAttr(myProfile && myProfile.full_name || '')}">
              <label>Phone</label>
              <input id="edit_phone" type="tel" required value="${escapeAttr(myProfile && myProfile.phone || '')}">

              <label>Country</label>
              <select id="edit_country"></select>

              <div id="edit_kenyaBox" class="hidden">
                <label>County</label>
                <select id="edit_ke_county"></select>
                <label>Sub-county</label>
                <select id="edit_ke_sub" disabled><option value="">—</option></select>
                <label>Ward</label>
                <select id="edit_ke_ward" disabled><option value="">—</option></select>
              </div>

              <div id="edit_afBox" class="hidden">
                <label>Province</label>
                <select id="edit_af_province"></select>
                <label>District</label>
                <select id="edit_af_district" disabled><option value="">—</option></select>
              </div>

              <div id="edit_geoBox" class="hidden">
                <div id="edit_geoLevels"></div>
              </div>

              <label>Town / City / Locality</label>
              <input id="edit_town" type="text" value="${escapeAttr(myProfile && myProfile.town || '')}">

              <label>Roles</label>
              <div class="role-box">
                ${ALL_ROLES.map(r => `
                  <div class="role-row">
                    <input type="checkbox" id="er_${r.v}" value="${r.v}" ${roles.includes(r.v) ? 'checked' : ''}>
                    <label for="er_${r.v}">${r.l}</label>
                  </div>
                `).join('')}
              </div>

              <div class="edit-actions">
                <button type="button" class="btn-cancel" id="cancelProfileEditBtn">Cancel</button>
                <button type="submit" class="btn-save" id="saveProfileBtn">Save profile</button>
              </div>
              <p class="edit-msg" id="profileMsg"></p>
            </form>
          </div>
        </div>

        <div class="card">
          <div class="tabs">
            <button class="tab-btn ${activeTab === 'products' ? 'active' : ''}" data-tab="products">Products (${myProducts.length})</button>
            <button class="tab-btn ${activeTab === 'listings' ? 'active' : ''}" data-tab="listings">Other listings (${myListings.length})</button>
          </div>
          <div style="text-align: right; margin-bottom: 8px;">
            <a class="btn-primary" href="post.html">+ Post new</a>
          </div>
          <div id="itemsBox">
            ${activeTab === 'products' ? renderProducts() : renderListings()}
          </div>
        </div>
      `;
    }

    function renderProducts() {
      if (!myProducts.length) return '<div class="empty">You haven\'t posted any products yet.<br><br><a class="btn-primary" href="post.html">+ Post your first product</a></div>';
      return myProducts.map(p => listingRow(p, 'product')).join('');
    }
    function renderListings() {
      if (!myListings.length) return '<div class="empty">You haven\'t posted any services, jobs, machinery or farms yet.<br><br><a class="btn-primary" href="post.html">+ Post a listing</a></div>';
      return myListings.map(p => listingRow(p, 'listing')).join('');
    }

    function listingRow(p, kind) {
      const img = p.image_url
        ? '<img src="' + escapeHtml(p.image_url) + '" alt="" onerror="this.parentNode.innerHTML=\'🌾\'">'
        : '🌾';
      const price = (p.currency || 'KES') + ' ' + Number(p.price || 0).toLocaleString();
      const unit = p.unit && p.unit !== 'unit' ? ' / ' + escapeHtml(p.unit) : '';
      const place = [p.location, p.ward, p.sub_county, p.county].filter(Boolean).join(', ');
      const status = p.status || 'active';
      const statusBadge = '<span class="status-badge status-' + status + '">' + status + '</span>';
      const soldBtn = status === 'active' ? '<button data-action="sold" data-kind="' + kind + '" data-id="' + p.id + '">Mark sold</button>' : '';
      const typeTag = kind === 'listing' && p.type ? '<span class="type-tag">' + escapeHtml(p.type) + '</span>' : '';
      const detailPage = kind === 'product' ? 'product.html' : 'listing.html';
      const detailUrl = detailPage + '?id=' + encodeURIComponent(p.id) + (kind === 'listing' ? '&type=' + p.type : '');

      return `
        <div class="row" data-row="${kind}-${p.id}">
          <div class="row-img">${img}</div>
          <div class="row-body">
            <p class="row-title">${typeTag}${escapeHtml(p.title || '(untitled)')} ${statusBadge}</p>
            <div class="row-price">${escapeHtml(price)}${unit}</div>
            ${place ? '<div class="row-meta">' + escapeHtml(place) + '</div>' : ''}
            <div class="row-actions">
              <a href="${detailUrl}">View</a>
              <button data-action="edit" data-kind="${kind}" data-id="${p.id}">Edit</button>
              ${soldBtn}
              <button class="danger" data-action="delete" data-kind="${kind}" data-id="${p.id}">Delete</button>
            </div>
            <div class="listing-edit" id="ledit-${kind}-${p.id}"></div>
          </div>
        </div>`;
    }

    function attachHandlers() {
      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) logoutBtn.addEventListener('click', logout);

      document.getElementById('editProfileBtn').addEventListener('click', openProfileEdit);
      document.getElementById('cancelProfileEditBtn').addEventListener('click', () => {
        document.getElementById('profileEditForm').classList.remove('show');
      });
      document.getElementById('profileForm').addEventListener('submit', saveProfile);

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeTab = btn.dataset.tab;
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('itemsBox').innerHTML =
            activeTab === 'products' ? renderProducts() : renderListings();
          attachRowHandlers();
        });
      });

      attachRowHandlers();
    }

    function attachRowHandlers() {
      document.querySelectorAll('button[data-action]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.id, kind = btn.dataset.kind, action = btn.dataset.action;

          if (action === 'edit') {
            openListingEdit(kind, id);
            return;
          }

          btn.disabled = true; const orig = btn.textContent; btn.textContent = '…';
          try {
            if (action === 'delete') {
              if (!confirm('Delete this permanently?')) { btn.disabled = false; btn.textContent = orig; return; }
              if (kind === 'product') await deleteMyProduct(id); else await deleteMyListing(id);
            }
            if (action === 'sold') {
              if (kind === 'product') await markMyProductSold(id); else await markMyListingSold(id);
            }
            await init();
          } catch (err) { alert('Error: ' + (err.message || 'Failed')); btn.disabled = false; btn.textContent = orig; }
        });
      });
    }

    /* Listing edit */
    function openListingEdit(kind, id) {
      const container = document.getElementById('ledit-' + kind + '-' + id);
      if (!container) return;

      if (container.classList.contains('show')) {
        container.classList.remove('show');
        return;
      }

      const list = kind === 'product' ? myProducts : myListings;
      const item = list.find(x => x.id === id);
      if (!item) return;

      editingListingId = id;
      editingKind = kind;
      editingImageFile = null;
      editingExistingImage = item.image_url || null;

      const type = kind === 'product' ? 'product' : (item.type || 'service');
      const titleOptions = TITLE_OPTIONS[type] || [];
      const selectedTitle = item.title || '';

      let titleOpts = '<option value="">— choose —</option>';
      titleOptions.forEach(t => {
        titleOpts += '<option value="' + escAttr(t) + '"' + (t === selectedTitle ? ' selected' : '') + '>' + escHtml(t) + '</option>';
      });
      const isCustom = selectedTitle && !titleOptions.includes(selectedTitle);
      titleOpts += '<option value="__other__"' + (isCustom ? ' selected' : '') + '>Other (specify)</option>';

      let catOpts = '';
      if (kind === 'product') {
        catOpts = CATEGORY_OPTIONS.map(c => {
          const sel = (item.category || '') === c.v ? ' selected' : '';
          return '<option value="' + escAttr(c.v) + '"' + sel + '>' + escHtml(c.l) + '</option>';
        }).join('');
      }

      container.innerHTML = `
        <label>Title</label>
        <select id="le_title_${kind}_${id}">${titleOpts}</select>
        <div id="le_titleOtherWrap_${kind}_${id}" style="display:${isCustom ? 'block' : 'none'};">
          <label>Specify title</label>
          <input id="le_titleOther_${kind}_${id}" value="${isCustom ? escAttr(selectedTitle) : ''}">
        </div>

        ${kind === 'product' ? '<label>Category</label><select id="le_category_' + kind + '_' + id + '">' + catOpts + '</select>' : ''}

        <label>Description</label>
        <textarea id="le_description_${kind}_${id}">${escHtml(item.description || '')}</textarea>

        <div class="row2">
          <div>
            <label>Price</label>
            <input id="le_price_${kind}_${id}" type="number" min="0" step="1" value="${item.price ?? 0}">
          </div>
          <div>
            <label>Unit</label>
            <input id="le_unit_${kind}_${id}" value="${escAttr(item.unit || 'unit')}">
          </div>
        </div>

        <div class="row2">
          <div>
            <label>Quantity</label>
            <input id="le_quantity_${kind}_${id}" type="number" min="1" step="1" value="${item.quantity ?? 1}">
          </div>
          <div>
            <label>County</label>
            <input id="le_county_${kind}_${id}" value="${escAttr(item.county || '')}">
          </div>
        </div>

        <label>Town / area</label>
        <input id="le_location_${kind}_${id}" value="${escAttr(item.location || '')}">

        <label>Photo</label>
        <div class="photo-pick" id="le_photoBox_${kind}_${id}">
          <div id="le_photoLabel_${kind}_${id}">📷  Tap to change photo</div>
          <input type="file" id="le_photoInput_${kind}_${id}" accept="image/*">
        </div>
        ${item.image_url ? '<img id="le_photoCurrent_' + kind + '_' + id + '" class="current-photo" src="' + escHtml(item.image_url) + '" alt="">' : ''}
        <img id="le_photoPreview_${kind}_${id}" class="photo-preview" alt="">

        <div class="edit-actions">
          <button type="button" class="btn-cancel" id="le_cancel_${kind}_${id}">Cancel</button>
          <button type="button" class="btn-save" id="le_save_${kind}_${id}">Save changes</button>
        </div>
        <p class="edit-msg" id="le_msg_${kind}_${id}"></p>
      `;
      container.classList.add('show');

      const titleSel = document.getElementById('le_title_' + kind + '_' + id);
      const titleOtherWrap = document.getElementById('le_titleOtherWrap_' + kind + '_' + id);
      titleSel.addEventListener('change', () => {
        if (titleSel.value === '__other__') {
          titleOtherWrap.style.display = 'block';
        } else {
          titleOtherWrap.style.display = 'none';
        }
      });

      const photoBox = document.getElementById('le_photoBox_' + kind + '_' + id);
      const photoInput = document.getElementById('le_photoInput_' + kind + '_' + id);
      const photoLabel = document.getElementById('le_photoLabel_' + kind + '_' + id);
      const photoPreview = document.getElementById('le_photoPreview_' + kind + '_' + id);

      photoBox.addEventListener('click', () => photoInput.click());
      photoInput.addEventListener('change', (e) => {
        const f = e.target.files[0];
        if (!f) return;
        editingImageFile = f;
        photoLabel.textContent = '📷  ' + f.name;
        photoPreview.src = URL.createObjectURL(f);
        photoPreview.classList.add('show');
        photoBox.classList.add('has-file');
      });

      document.getElementById('le_cancel_' + kind + '_' + id).addEventListener('click', () => {
        container.classList.remove('show');
        editingImageFile = null;
        editingListingId = null;
        editingKind = null;
      });

      document.getElementById('le_save_' + kind + '_' + id).addEventListener('click', () => saveListingEdit(kind, id));
    }

    async function saveListingEdit(kind, id) {
      const msg = document.getElementById('le_msg_' + kind + '_' + id);
      const btn = document.getElementById('le_save_' + kind + '_' + id);
      msg.className = 'edit-msg'; msg.textContent = '';
      btn.disabled = true; btn.textContent = 'Saving…';

      try {
        const titleSel = document.getElementById('le_title_' + kind + '_' + id);
        let title;
        if (titleSel.value === '__other__') {
          title = document.getElementById('le_titleOther_' + kind + '_' + id).value.trim();
          if (!title) throw new Error('Please type the title.');
        } else if (titleSel.value) {
          title = titleSel.value;
        } else {
          throw new Error('Please choose a title.');
        }

        let image_url = editingExistingImage;
        if (editingImageFile) {
          btn.textContent = 'Uploading…';
          image_url = await uploadImage(editingImageFile, kind === 'product' ? 'product' : 'listing');
        }

        const updates = {
          title,
          description: document.getElementById('le_description_' + kind + '_' + id).value.trim() || null,
          price:       Number(document.getElementById('le_price_' + kind + '_' + id).value) || 0,
          unit:        document.getElementById('le_unit_' + kind + '_' + id).value.trim() || 'unit',
          quantity:    Number(document.getElementById('le_quantity_' + kind + '_' + id).value) || 1,
          county:      document.getElementById('le_county_' + kind + '_' + id).value.trim() || null,
          location:    document.getElementById('le_location_' + kind + '_' + id).value.trim() || null,
          image_url:   image_url
        };

        if (kind === 'product') {
          const catSel = document.getElementById('le_category_' + kind + '_' + id);
          if (catSel) updates.category = catSel.value || null;
          await updateProduct(id, updates);
        } else {
          await updateListing(id, updates);
        }

        msg.className = 'edit-msg ok';
        msg.textContent = '✅ Saved.';
        editingImageFile = null;
        setTimeout(init, 600);
      } catch (err) {
        msg.className = 'edit-msg error';
        msg.textContent = '❌ ' + (err.message || 'Failed');
        btn.disabled = false;
        btn.textContent = 'Save changes';
      }
    }

    /* Profile edit */
    async function openProfileEdit() {
      document.getElementById('profileEditForm').classList.add('show');

      const countryName = (myProfile && myProfile.country) || 'Kenya';
      const c = COUNTRIES.find(x => x.n === countryName) || { c: 'ke' };
      const countrySel = document.getElementById('edit_country');
      populateCountries(countrySel, c.c);
      countrySel.addEventListener('change', () => onProfileCountry(false));

      await onProfileCountry(true);
    }

    function showProfileBox(id) {
      ['edit_kenyaBox','edit_afBox','edit_geoBox'].forEach(x => {
        document.getElementById(x).classList.toggle('hidden', x !== id);
      });
    }

    async function onProfileCountry(isPrefill) {
      const code = document.getElementById('edit_country').value;
      if (code === 'ke') {
        showProfileBox('edit_kenyaBox');
        await loadKenyaForProfile(isPrefill);
      } else if (code === 'af') {
        showProfileBox('edit_afBox');
        await loadAfForProfile(isPrefill);
      } else if (code) {
        showProfileBox('edit_geoBox');
        await loadGeoForProfile(code);
      } else {
        showProfileBox('');
      }
    }

    async function loadKenyaForProfile(isPrefill) {
      const msg = document.getElementById('profileMsg');
      const countySel = document.getElementById('edit_ke_county');
      const subSel = document.getElementById('edit_ke_sub');
      const wardSel = document.getElementById('edit_ke_ward');
      if (!keCounties) {
        countySel.innerHTML = '<option value="">Loading counties…</option>';
        msg.className = 'edit-msg info'; msg.textContent = 'Loading Kenya locations…';
        try { keCounties = await loadKenyaHierarchy(); }
        catch (e) { countySel.innerHTML = '<option value="">Failed to load</option>'; msg.className='edit-msg error'; msg.textContent = e.message; return; }
      }
      fillSelect(countySel, keCounties.map(c => ({ value: geoName(c), label: geoName(c) })), '', '— choose county —');
      msg.textContent = ''; msg.className = 'edit-msg';

      if (isPrefill && myProfile && myProfile.county) {
        countySel.value = myProfile.county;
        const county = keCounties.find(c => geoName(c) === myProfile.county);
        if (county) {
          const subs = geoChildrenOf(county).map(s => ({ value: geoName(s), label: geoName(s) }));
          fillSelect(subSel, subs, '', '— choose sub-county —'); subSel.disabled = false;
          if (myProfile.sub_county) {
            subSel.value = myProfile.sub_county;
            const sub = geoChildrenOf(county).find(s => geoName(s) === myProfile.sub_county);
            if (sub) {
              const wards = wardListOf(sub).map(w => ({ value: geoName(w), label: geoName(w) }));
              fillSelect(wardSel, wards, '', '— choose ward —'); wardSel.disabled = false;
              if (myProfile.ward) wardSel.value = myProfile.ward;
            }
          }
        }
      }

      countySel.onchange = () => {
        const cname = countySel.value;
        if (!cname) { subSel.innerHTML = '<option value="">—</option>'; subSel.disabled = true; wardSel.innerHTML = '<option value="">—</option>'; wardSel.disabled = true; return; }
        const county = keCounties.find(c => geoName(c) === cname);
        fillSelect(subSel, geoChildrenOf(county).map(s => ({ value: geoName(s), label: geoName(s) })), '', '— choose sub-county —'); subSel.disabled = false;
        wardSel.innerHTML = '<option value="">—</option>'; wardSel.disabled = true;
      };
      subSel.onchange = () => {
        const cname = countySel.value, sname = subSel.value;
        if (!cname || !sname) { wardSel.innerHTML = '<option value="">—</option>'; wardSel.disabled = true; return; }
        const county = keCounties.find(c => geoName(c) === cname);
        const sub = geoChildrenOf(county).find(s => geoName(s) === sname);
        fillSelect(wardSel, wardListOf(sub).map(w => ({ value: geoName(w), label: geoName(w) })), '', '— choose ward —'); wardSel.disabled = false;
      };
    }

    async function loadAfForProfile(isPrefill) {
      const msg = document.getElementById('profileMsg');
      const provSel = document.getElementById('edit_af_province');
      const distSel = document.getElementById('edit_af_district');
      if (!afProvinces) {
        provSel.innerHTML = '<option value="">Loading provinces…</option>';
        msg.className = 'edit-msg info'; msg.textContent = 'Loading Afghanistan locations…';
        try { afProvinces = await loadAfghanistanHierarchy(); }
        catch (e) { provSel.innerHTML = '<option value="">Failed to load</option>'; msg.className='edit-msg error'; msg.textContent = e.message; return; }
      }
      fillSelect(provSel, afProvinces.map(p => ({ value: geoName(p), label: geoName(p) })), '', '— choose province —');
      msg.textContent = ''; msg.className = 'edit-msg';

      if (isPrefill && myProfile && myProfile.county) {
        provSel.value = myProfile.county;
        const prov = afProvinces.find(p => geoName(p) === myProfile.county);
        if (prov) {
          const districts = (prov.district || prov.districts || []).map(d => ({ value: geoName(d), label: geoName(d) }));
          fillSelect(distSel, districts, '', '— choose district —'); distSel.disabled = false;
          if (myProfile.sub_county) distSel.value = myProfile.sub_county;
        }
      }

      provSel.onchange = () => {
        const name = provSel.value;
        if (!name) { distSel.innerHTML = '<option value="">—</option>'; distSel.disabled = true; return; }
        const prov = afProvinces.find(p => geoName(p) === name);
        const districts = (prov.district || prov.districts || []).map(d => ({ value: geoName(d), label: geoName(d) }));
        fillSelect(distSel, districts, '', '— choose district —'); distSel.disabled = false;
      };
    }

    async function loadGeoForProfile(code) {
      const box = document.getElementById('edit_geoLevels');
      box.innerHTML = '<p class="edit-msg info">Loading regions…</p>';
      try {
        const country = await geoCountryInfo(code);
        if (!country) throw new Error('Country not found');
        box.innerHTML = '';
        const lab = document.createElement('label'); lab.textContent = 'Region / State';
        const sel = document.createElement('select'); sel.innerHTML = '<option value="">Loading…</option>';
        box.appendChild(lab); box.appendChild(sel);
        const kids = await geoChildren(country.geonameId);
        fillSelect(sel, kids.map(k => ({ value: k.geonameId, label: k.name })), '', '— choose —');
      } catch (e) {
        box.innerHTML = '<p class="edit-msg error">' + escapeHtml(e.message) + '</p>';
      }
    }

    async function saveProfile(e) {
      e.preventDefault();
      const msg = document.getElementById('profileMsg');
      const btn = document.getElementById('saveProfileBtn');
      msg.className = 'edit-msg'; msg.textContent = '';

      const code = document.getElementById('edit_country').value;
      const countryName = (COUNTRIES.find(c => c.c === code) || { n: code }).n;

      const roles = [];
      document.querySelectorAll('.role-box input[type=checkbox]').forEach(cb => { if (cb.checked) roles.push(cb.value); });
      if (!roles.length) { msg.className='edit-msg error'; msg.textContent='Please tick at least one role.'; return; }

      let county = null, sub_county = null, ward = null, region = null;
      if (code === 'ke') {
        county = document.getElementById('edit_ke_county').value || null;
        sub_county = document.getElementById('edit_ke_sub').value || null;
        ward = document.getElementById('edit_ke_ward').value || null;
      } else if (code === 'af') {
        county = document.getElementById('edit_af_province').value || null;
        sub_county = document.getElementById('edit_af_district').value || null;
      } else if (code) {
        const sel = document.querySelector('#edit_geoLevels select');
        if (sel && sel.value) {
          const opt = sel.options[sel.selectedIndex];
          region = opt ? opt.text : null;
        }
      }

      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        const s = await getSession();
        const r = await db.from('profiles').update({
          full_name:  document.getElementById('edit_full_name').value.trim(),
          phone:      document.getElementById('edit_phone').value.trim(),
          country:    countryName,
          county, sub_county, ward, region,
          town:       document.getElementById('edit_town').value.trim() || null,
          roles
        }).eq('id', s.user.id).select();
        if (r.error) throw r.error;
        msg.className = 'edit-msg ok';
        msg.textContent = '✅ Saved.';
        setTimeout(init, 600);
      } catch (err) {
        msg.className = 'edit-msg error';
        msg.textContent = err.message || 'Failed to save.';
        btn.disabled = false;
      } finally {
        btn.textContent = 'Save profile';
      }
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function escapeAttr(s) { return escapeHtml(s); }
    function escHtml(s) { return escapeHtml(s); }
    function escAttr(s) { return escapeHtml(s); }
  </script>
</body>
</html>
