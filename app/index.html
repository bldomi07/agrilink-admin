<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgriLink — Buy & Sell Farm Produce in Kenya</title>
  <meta name="description" content="AgriLink — Kenya's marketplace for farmers, buyers and sellers. Fresh produce, fair prices, direct from the farm." />
  <link rel="stylesheet" href="app.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚜</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .search-wrap {
      background: #fff;
      padding: 10px 12px 12px;
      border-bottom: 1px solid #e6ece8;
      position: sticky;
      top: 56px;
      z-index: 9;
    }
    .search-input-wrap {
      display: flex;
      gap: 8px;
    }
    .search-input {
      flex: 1;
      padding: 11px 14px;
      border: 1px solid #cfd8d2;
      border-radius: 10px;
      font-size: 15px;
      background: #fbfdfb;
    }
    .clear-btn {
      padding: 11px 12px;
      background: #fff;
      color: #b00020;
      border: 1px solid #b00020;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }
    .clear-btn.show { display: inline-block; }

    .filters {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 10px 0 0;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      background: #f1f5f2;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }
    .chip.active {
      background: #1e7a3c;
      color: #fff;
    }
    .county-select {
      margin-top: 8px;
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cfd8d2;
      border-radius: 10px;
      font-size: 14px;
      background: #fbfdfb;
    }
    .result-count {
      padding: 10px 4px 0;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="logo">
      <span class="logo-icon">🚜</span>
      <span class="logo-text">AgriLink</span>
    </div>
    <div style="display:flex; gap:6px;">
      <a href="sell.html" class="login-btn" id="sellLink" style="display:none; background:#1e7a3c; color:#fff; border-color:#1e7a3c;">+ Sell</a>
      <a href="login.html" class="login-btn" id="authLink">Log in</a>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-type="product">Products</button>
    <button class="tab" disabled>Services<small>soon</small></button>
    <button class="tab" disabled>Jobs<small>soon</small></button>
    <button class="tab" disabled>Machinery<small>soon</small></button>
    <button class="tab" disabled>Farms<small>soon</small></button>
  </nav>

  <div class="search-wrap">
    <div class="search-input-wrap">
      <input id="searchInput" class="search-input" type="search" placeholder="Search products…" autocomplete="off">
      <button id="clearBtn" class="clear-btn">Clear</button>
    </div>

    <div class="filters" id="categoryFilters">
      <button class="chip active" data-cat="">All</button>
      <button class="chip" data-cat="grain">Grain</button>
      <button class="chip" data-cat="vegetable">Vegetables</button>
      <button class="chip" data-cat="fruit">Fruits</button>
      <button class="chip" data-cat="livestock">Livestock</button>
      <button class="chip" data-cat="dairy">Dairy</button>
      <button class="chip" data-cat="poultry">Poultry</button>
      <button class="chip" data-cat="seed">Seeds</button>
      <button class="chip" data-cat="other">Other</button>
    </div>

    <select id="countyFilter" class="county-select">
      <option value="">All counties</option>
    </select>
  </div>

  <main id="content">
    <p class="loading">Loading products…</p>
  </main>

  <footer class="app-footer">
    <p>© AgriLink — Kenya</p>
  </footer>

  <script src="supabase.js"></script>
  <script>
    let ALL_PRODUCTS = [];
    let state = { q: '', cat: '', county: '' };

    document.addEventListener('DOMContentLoaded', init);

    async function init() {
      try {
        const session = await getSession();
        const authLink = document.getElementById('authLink');
        const sellLink = document.getElementById('sellLink');
        if (session) {
          authLink.textContent = 'My account';
          authLink.href = 'me.html';
          if (sellLink) sellLink.style.display = '';
        } else {
          authLink.textContent = 'Log in';
          authLink.href = 'login.html';
        }
      } catch (e) {}

      attachFilterHandlers();
      await loadProducts();
    }

    function attachFilterHandlers() {
      const searchInput = document.getElementById('searchInput');
      const clearBtn = document.getElementById('clearBtn');
      const countySelect = document.getElementById('countyFilter');

      searchInput.addEventListener('input', () => {
        state.q = searchInput.value.trim().toLowerCase();
        updateClearBtn();
        render();
      });

      clearBtn.addEventListener('click', () => {
        state = { q: '', cat: '', county: '' };
        searchInput.value = '';
        countySelect.value = '';
        document.querySelectorAll('.chip').forEach(c => {
          c.classList.toggle('active', c.dataset.cat === '');
        });
        updateClearBtn();
        render();
      });

      document.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
          document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          state.cat = chip.dataset.cat;
          updateClearBtn();
          render();
        });
      });

      countySelect.addEventListener('change', () => {
        state.county = countySelect.value;
        updateClearBtn();
        render();
      });
    }

    function updateClearBtn() {
      const active = state.q || state.cat || state.county;
      document.getElementById('clearBtn').classList.toggle('show', !!active);
    }

    async function loadProducts() {
      const content = document.getElementById('content');
      try {
        ALL_PRODUCTS = await getPublicProducts();
        populateCounties();
        render();
      } catch (err) {
        content.innerHTML = '<div class="error">Failed to load: ' + escapeHtml(err.message) + '</div>';
      }
    }

    function populateCounties() {
      const select = document.getElementById('countyFilter');
      const counties = Array.from(new Set(
        ALL_PRODUCTS.map(p => (p.county || '').trim()).filter(Boolean)
      )).sort();
      select.innerHTML = '<option value="">All counties</option>' +
        counties.map(c => '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + '</option>').join('');
    }

    function applyFilters() {
      return ALL_PRODUCTS.filter(p => {
        if (state.q) {
          const title = (p.title || '').toLowerCase();
          const desc = (p.description || '').toLowerCase();
          if (!title.includes(state.q) && !desc.includes(state.q)) return false;
        }
        if (state.cat && (p.category || '') !== state.cat) return false;
        if (state.county && (p.county || '') !== state.county) return false;
        return true;
      });
    }

    function render() {
      const content = document.getElementById('content');
      const list = applyFilters();

      if (ALL_PRODUCTS.length === 0) {
        content.innerHTML = '<div class="empty">No products yet.<br>Check back soon!</div>';
        return;
      }

      if (list.length === 0) {
        content.innerHTML = '<div class="empty">No products match your search.<br>Try clearing the filters.</div>';
        return;
      }

      content.innerHTML =
        '<div class="result-count">' + list.length + ' product' + (list.length === 1 ? '' : 's') + ' found</div>' +
        '<div class="grid" style="margin-top:8px;">' +
        list.map(cardHtml).join('') +
        '</div>';
    }

    function cardHtml(p) {
      const img = p.image_url
        ? '<img src="' + escapeHtml(p.image_url) + '" alt="' + escapeHtml(p.title || '') + '" loading="lazy" onerror="this.parentNode.innerHTML=\'<div class=&quot;placeholder&quot;>🌾</div>\'">'
        : '<div class="placeholder">🌾</div>';

      const featured = p.is_featured ? '<span class="badge-featured">Featured</span>' : '';
      const price = (p.currency || 'KES') + ' ' + Number(p.price || 0).toLocaleString();
      const unit = p.unit ? ' / ' + escapeHtml(p.unit) : '';
      const place = [p.location, p.county].filter(Boolean).join(', ');

      return '<a class="card" href="product.html?id=' + encodeURIComponent(p.id) + '">' +
          '<div class="card-img">' + img + featured + '</div>' +
          '<div class="card-body">' +
            '<div class="card-title">' + escapeHtml(p.title || '(untitled)') + '</div>' +
            '<div class="card-price">' + escapeHtml(price) + unit + '</div>' +
            '<div class="card-place">' + escapeHtml(place) + '</div>' +
          '</div>' +
        '</a>';
    }

    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
