<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriLink Admin — App Ads</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif;
         background:#f5f8f5; margin:0; padding:20px; color:#1b5e20; }
  .container { max-width:640px; margin:auto; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  h1 { font-size:22px; margin:0; }
  h2 { font-size:18px; margin:0 0 14px; }
  .card { background:#fff; border:1px solid #c8e6c9; border-radius:14px;
          padding:16px; margin-bottom:12px; }
  button { cursor:pointer; border-radius:10px; padding:10px 16px;
           font-weight:600; font-size:14px; border:none; font-family:inherit; }
  .btn-primary { background:#2e7d32; color:#fff; }
  .btn-secondary { background:#fff; color:#2e7d32; border:1.5px solid #2e7d32; }
  .btn-danger { background:#fff; color:#c62828; border:1.5px solid #c62828; }
  input, textarea, select { width:100%; padding:10px; border:1px solid #c8e6c9;
           border-radius:10px; margin:4px 0 12px; font-size:14px; font-family:inherit;
           background:#fff; color:#222; }
  label { font-size:13px; font-weight:600; color:#2e7d32; display:block; }
  .msg { color:#c62828; font-size:13px; margin-top:8px; }
  .badge { font-size:12px; font-weight:600; padding:3px 8px; border-radius:6px; display:inline-block; }
  .active { background:#e8f5e9; color:#2e7d32; }
  .inactive { background:#eee; color:#888; }
  .row-actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.5);
              z-index:1000; overflow-y:auto; padding:20px; display:none; }
  .modal { background:#fff; max-width:520px; margin:20px auto;
           padding:22px; border-radius:14px; }
  .back-link { text-decoration:none; padding:10px 16px; border-radius:10px;
               border:1.5px solid #2e7d32; color:#2e7d32; font-weight:600; font-size:14px; }
</style>
</head>
<body>
<div class="container">

  <div class="topbar">
    <h1>📱 App Ads</h1>
    <a href="index.html" class="back-link">← Back</a>
  </div>

  <button id="newBtn" class="btn-primary" style="margin-bottom:16px;">+ New App Ad</button>

  <div id="list">Loading…</div>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h2 id="modalTitle">New App Ad</h2>
    <form id="form">
      <input type="hidden" id="f_id">
      <label>Title</label>
      <input id="f_title" required>
      <label>Body</label>
      <textarea id="f_body" rows="3"></textarea>
      <label>Button Label</label>
      <input id="f_button_label" value="📩 Contact Admin">
      <label>Link URL</label>
      <input id="f_link_url" required>
      <label>Position</label>
      <select id="f_position">
        <option value="home_top">Home — Top</option>
        <option value="home_middle" selected>Home — Middle</option>
        <option value="home_bottom">Home — Bottom</option>
        <option value="splash">Splash</option>
      </select>
      <label>Sort Order (lower = first)</label>
      <input id="f_sort_order" type="number" value="1">
      <label>Display Seconds (5–300)</label>
      <input id="f_display_seconds" type="number" value="30" min="5" max="300">
      <label>Starts At (optional)</label>
      <input id="f_starts_at" type="datetime-local">
      <label>Ends At (optional)</label>
      <input id="f_ends_at" type="datetime-local">
      <label style="display:flex; gap:8px; align-items:center; margin-top:6px;">
        <input id="f_is_active" type="checkbox" checked style="width:auto; margin:0;"> Active
      </label>
      <div style="display:flex; gap:10px; margin-top:18px;">
        <button type="submit" class="btn-primary">Save</button>
        <button type="button" id="cancelBtn" class="btn-secondary">Cancel</button>
      </div>
      <p class="msg" id="formMsg"></p>
    </form>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://uwrktkusglldbmezepya.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ji1ivwRE1mtYGl9HcjKkXg_JdT4Msss';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function requireLogin() {
  const { data } = await db.auth.getSession();
  if (!data || !data.session) {
    window.location.href = 'index.html';
    return false;
  }
  return true;
}

async function loadAds() {
  const list = document.getElementById('list');
  list.innerHTML = 'Loading…';
  const { data, error } = await db.from('app_advertisements')
    .select('*').order('sort_order', { ascending: true });
  if (error) { list.innerHTML = '<p class="msg">' + error.message + '</p>'; return; }
  if (!data || !data.length) { list.innerHTML = '<p>No app ads yet.</p>'; return; }
  list.innerHTML = data.map(ad => `
    <div class="card" style="${ad.is_active ? '' : 'opacity:0.6;'}">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
        <strong style="font-size:16px;">${esc(ad.title)}</strong>
        <span class="badge ${ad.is_active ? 'active' : 'inactive'}">
          ${ad.is_active ? 'active' : 'inactive'}
        </span>
      </div>
      <p style="margin:8px 0; color:#555;">${esc(ad.body || '')}</p>
      <div style="font-size:12px; color:#777;">
        ${esc(ad.position)} · sort ${ad.sort_order} · ${ad.display_seconds}s
      </div>
      <div class="row-actions">
        <button class="btn-secondary" onclick="editAd('${ad.id}')">Edit</button>
        <button class="btn-secondary" onclick="toggleAd('${ad.id}', ${ad.is_active})">
          ${ad.is_active ? 'Deactivate' : 'Activate'}
        </button>
        <button class="btn-danger" onclick="deleteAd('${ad.id}')">Delete</button>
      </div>
    </div>
  `).join('');
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function openModal(ad) {
  ad = ad || {};
  document.getElementById('modalTitle').textContent = ad.id ? 'Edit App Ad' : 'New App Ad';
  document.getElementById('f_id').value = ad.id || '';
  document.getElementById('f_title').value = ad.title || '';
  document.getElementById('f_body').value = ad.body || '';
  document.getElementById('f_button_label').value = ad.button_label || '📩 Contact Admin';
  document.getElementById('f_link_url').value = ad.link_url || '';
  document.getElementById('f_position').value = ad.position || 'home_middle';
  document.getElementById('f_sort_order').value = ad.sort_order || 1;
  document.getElementById('f_display_seconds').value = ad.display_seconds || 30;
  document.getElementById('f_starts_at').value = ad.starts_at ? ad.starts_at.slice(0,16) : '';
  document.getElementById('f_ends_at').value = ad.ends_at ? ad.ends_at.slice(0,16) : '';
  document.getElementById('f_is_active').checked = ad.is_active !== false;
  document.getElementById('formMsg').textContent = '';
  document.getElementById('modal').style.display = 'block';
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
}

async function editAd(id) {
  const { data, error } = await db.from('app_advertisements').select('*').eq('id', id).single();
  if (error) { alert(error.message); return; }
  openModal(data);
}

async function toggleAd(id, current) {
  await db.from('app_advertisements').update({ is_active: !current }).eq('id', id);
  loadAds();
}

async function deleteAd(id) {
  if (!confirm('Delete this app ad?')) return;
  await db.from('app_advertisements').delete().eq('id', id);
  loadAds();
}

document.getElementById('newBtn').onclick = () => openModal(null);
document.getElementById('cancelBtn').onclick = closeModal;

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('formMsg');
  msg.textContent = 'Saving…';
  const id = document.getElementById('f_id').value;
  const payload = {
    title: document.getElementById('f_title').value.trim(),
    body: document.getElementById('f_body').value.trim(),
    button_label: document.getElementById('f_button_label').value.trim(),
    link_url: document.getElementById('f_link_url').value.trim(),
    position: document.getElementById('f_position').value,
    sort_order: parseInt(document.getElementById('f_sort_order').value) || 1,
    display_seconds: parseInt(document.getElementById('f_display_seconds').value) || 30,
    starts_at: document.getElementById('f_starts_at').value || null,
    ends_at: document.getElementById('f_ends_at').value || null,
    is_active: document.getElementById('f_is_active').checked
  };
  const { error } = id
    ? await db.from('app_advertisements').update(payload).eq('id', id)
    : await db.from('app_advertisements').insert(payload);
  if (error) { msg.textContent = error.message; return; }
  closeModal();
  loadAds();
});

(async () => {
  if (await requireLogin()) loadAds();
})();
</script>
</body>
</html>
