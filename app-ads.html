<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriLink Admin — App Ads</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif;
         background:#f5f8f5; margin:0; padding:20px; color:#1b5e20; }
  .container { max-width:640px; margin:auto; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  h1 { font-size:22px; margin:0; }
  h2 { font-size:18px; margin:0 0 14px; }
  .card { background:#fff; border:1px solid #c8e6c9; border-radius:14px;
          padding:16px; margin-bottom:12px; }
  button { cursor:pointer; border-radius:10px; padding:10px 16px;
           font-weight:600; font-size:14px; border:none; font-family:inherit; }
  .btn-primary { background:#2e7d32; color:#fff; }
  .btn-primary:disabled { opacity:0.6; cursor:not-allowed; }
  .btn-secondary { background:#fff; color:#2e7d32; border:1.5px solid #2e7d32; }
  .btn-danger { background:#fff; color:#c62828; border:1.5px solid #c62828; }
  input, textarea, select { width:100%; padding:10px; border:1px solid #c8e6c9;
           border-radius:10px; margin:4px 0 12px; font-size:14px; font-family:inherit;
           background:#fff; color:#222; }
  label { font-size:13px; font-weight:600; color:#2e7d32; display:block; }
  .msg { color:#c62828; font-size:13px; margin-top:8px; min-height:18px; }
  .msg.ok { color:#2e7d32; }
  .badge { font-size:12px; font-weight:600; padding:3px 8px; border-radius:6px; display:inline-block; }
  .active { background:#e8f5e9; color:#2e7d32; }
  .inactive { background:#eee; color:#888; }
  .row-actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.5);
              z-index:1000; overflow-y:auto; padding:20px; display:none; }
  .modal { background:#fff; max-width:520px; margin:20px auto;
           padding:22px; border-radius:14px; }
  .back-link { text-decoration:none; padding:10px 16px; border-radius:10px;
               border:1.5px solid #2e7d32; color:#2e7d32; font-weight:600; font-size:14px; }

  .upload-box {
    margin: 4px 0 4px;
    border: 2px dashed #c8e6c9;
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    background: #f8fdf9;
    cursor: pointer;
    font-size: 13px;
    color: #666;
  }
  .upload-box:active { background: #e8f5e9; }
  .upload-box.has-file { border-color: #2e7d32; background: #e8f5e9; color: #1b5e20; font-weight: 600; }
  .upload-box input[type=file] { display: none; }
  .preview-thumb {
    margin-top: 8px; max-width: 100%; max-height: 160px;
    border-radius: 8px; display: none;
  }
  .preview-thumb.show { display: block; }
  .hint { font-size: 11px; color: #888; margin: 0 0 12px; }
  .or-sep {
    text-align: center; font-size: 12px; color: #aaa;
    margin: 4px 0 8px; position: relative;
  }
  .or-sep::before, .or-sep::after {
    content: ''; position: absolute; top: 50%;
    width: 40%; height: 1px; background: #e0eee1;
  }
  .or-sep::before { left: 0; }
  .or-sep::after { right: 0; }
</style>
</head>
<body>
<div class="container">

  <div class="topbar">
    <h1>📱 App Ads</h1>
    <a href="index.html" class="back-link">← Back</a>
  </div>

  <button id="newBtn" class="btn-primary" style="margin-bottom:16px;">+ New App Ad</button>

  <div id="list">Loading…</div>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h2 id="modalTitle">New App Ad</h2>
    <form id="form">
      <input type="hidden" id="f_id">

      <label>Title</label>
      <input id="f_title" required>

      <label>Body</label>
      <textarea id="f_body" rows="3"></textarea>

      <label>Button Label</label>
      <input id="f_button_label" value="📩 Contact Admin">

      <label>Ad Media (image or video shown in the box)</label>
      <div class="upload-box" id="photoBox">
        <div id="photoLabel">📷  Tap to choose a photo or video</div>
        <input type="file" id="photoInput" accept="image/*,video/mp4,video/webm,video/quicktime">
      </div>
      <img id="photoPreview" class="preview-thumb" alt="">
      <video id="videoPreview" class="preview-thumb" controls muted></video>

      <label>Link Destination</label>
      <div class="upload-box" id="fileBox">
        <div id="fileLabel">📎  Choose a file from device (PDF, image, doc…)</div>
        <input type="file" id="fileInput">
      </div>
      <p class="hint" id="fileHint">Uploads to AgriLink storage and becomes the ad link.</p>

      <div class="or-sep">OR paste a URL below</div>

      <input id="f_link_url" placeholder="https://wa.me/254…  or  https://example.com">

      <label>Position</label>
      <select id="f_position">
        <option value="home_top">Home — Top</option>
        <option value="home_middle" selected>Home — Middle</option>
        <option value="home_bottom">Home — Bottom</option>
        <option value="splash">Splash</option>
      </select>

      <label>Sort Order (lower = first)</label>
      <input id="f_sort_order" type="number" value="1">

      <label>Display Seconds (5–300)</label>
      <input id="f_display_seconds" type="number" value="30" min="5" max="300">

      <label>Starts At (optional)</label>
      <input id="f_starts_at" type="datetime-local">

      <label>Ends At (optional)</label>
      <input id="f_ends_at" type="datetime-local">

      <label style="display:flex; gap:8px; align-items:center; margin-top:6px;">
        <input id="f_is_active" type="checkbox" checked style="width:auto; margin:0;"> Active
      </label>

      <div style="display:flex; gap:10px; margin-top:18px;">
        <button type="submit" class="btn-primary" id="saveBtn">Save</button>
        <button type="button" id="cancelBtn" class="btn-secondary">Cancel</button>
      </div>
      <p class="msg" id="formMsg"></p>
    </form>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://uwrktkusglldbmezepya.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ji1ivwRE1mtYGl9HcjKkXg_JdT4Msss';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const BUCKET = 'agrilink-images';
const FOLDER = 'app-ad-uploads';

let pickedPhoto = null;
let pickedLinkFile = null;
let existingImageUrl = null;
let existingLinkUrl = null;

async function requireLogin() {
  const { data } = await db.auth.getSession();
  if (!data || !data.session) {
    window.location.href = 'index.html';
    return false;
  }
  return true;
}

function isVideoUrl(url) {
  return /\.(mp4|webm|mov|m4v|ogg)(\?.*)?$/i.test(url || '');
}

async function loadAds() {
  const list = document.getElementById('list');
  list.innerHTML = 'Loading…';
  const { data, error } = await db.from('app_advertisements')
    .select('*').order('sort_order', { ascending: true });
  if (error) { list.innerHTML = '<p class="msg">' + error.message + '</p>'; return; }
  if (!data || !data.length) { list.innerHTML = '<p>No app ads yet.</p>'; return; }

  list.innerHTML = data.map(ad => {
    let media = '';
    if (ad.image_url) {
      if (isVideoUrl(ad.image_url)) {
        media = '<video src="' + esc(ad.image_url) + '" style="max-width:100%; max-height:120px; border-radius:8px; margin:6px 0;" controls muted></video>';
      } else {
        media = '<img src="' + esc(ad.image_url) + '" style="max-width:100%; max-height:120px; border-radius:8px; margin:6px 0;">';
      }
    }

    return `
    <div class="card" style="${ad.is_active ? '' : 'opacity:0.6;'}">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
        <strong style="font-size:16px;">${esc(ad.title)}</strong>
        <span class="badge ${ad.is_active ? 'active' : 'inactive'}">
          ${ad.is_active ? 'active' : 'inactive'}
        </span>
      </div>
      <p style="margin:8px 0; color:#555;">${esc(ad.body || '')}</p>
      ${media}
      <div style="font-size:12px; color:#777; word-break:break-all;">
        ${esc(ad.position)} · sort ${ad.sort_order} · ${ad.display_seconds}s
        ${ad.link_url ? '<br>Link: ' + esc(ad.link_url) : ''}
      </div>
      <div class="row-actions">
        <button class="btn-secondary" onclick="editAd('${ad.id}')">Edit</button>
        <button class="btn-secondary" onclick="toggleAd('${ad.id}', ${ad.is_active})">
          ${ad.is_active ? 'Deactivate' : 'Activate'}
        </button>
        <button class="btn-danger" onclick="deleteAd('${ad.id}')">Delete</button>
      </div>
    </div>
    `;
  }).join('');
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function openModal(ad) {
  ad = ad || {};

  document.getElementById('modalTitle').textContent = ad.id ? 'Edit App Ad' : 'New App Ad';
  document.getElementById('f_id').value = ad.id || '';
  document.getElementById('f_title').value = ad.title || '';
  document.getElementById('f_body').value = ad.body || '';
  document.getElementById('f_button_label').value = ad.button_label || '📩 Contact Admin';
  document.getElementById('f_position').value = ad.position || 'home_middle';
  document.getElementById('f_sort_order').value = ad.sort_order || 1;
  document.getElementById('f_display_seconds').value = ad.display_seconds || 30;
  document.getElementById('f_starts_at').value = ad.starts_at ? ad.starts_at.slice(0,16) : '';
  document.getElementById('f_ends_at').value = ad.ends_at ? ad.ends_at.slice(0,16) : '';
  document.getElementById('f_is_active').checked = ad.is_active !== false;

  pickedPhoto = null;
  pickedLinkFile = null;
  existingImageUrl = ad.image_url || null;
  existingLinkUrl = ad.link_url || null;

  const photoPreview = document.getElementById('photoPreview');
  const videoPreview = document.getElementById('videoPreview');
  const photoLabel = document.getElementById('photoLabel');
  const photoBox = document.getElementById('photoBox');
  document.getElementById('photoInput').value = '';
  photoPreview.classList.remove('show');
  videoPreview.classList.remove('show');
  videoPreview.src = '';
  photoPreview.src = '';

  if (existingImageUrl) {
    if (isVideoUrl(existingImageUrl)) {
      videoPreview.src = existingImageUrl;
      videoPreview.classList.add('show');
      photoLabel.textContent = '📹  Current video (tap to change)';
    } else {
      photoPreview.src = existingImageUrl;
      photoPreview.classList.add('show');
      photoLabel.textContent = '📷  Current photo (tap to change)';
    }
    photoBox.classList.add('has-file');
  } else {
    photoLabel.textContent = '📷  Tap to choose a photo or video';
    photoBox.classList.remove('has-file');
  }

  document.getElementById('fileInput').value = '';
  const fileBox = document.getElementById('fileBox');
  const fileLabel = document.getElementById('fileLabel');
  const fileHint = document.getElementById('fileHint');
  if (existingLinkUrl) {
    fileLabel.textContent = '📎  Current link is set — tap to upload a new file instead';
    fileBox.classList.remove('has-file');
    fileHint.textContent = 'Current link: ' + existingLinkUrl.slice(0, 60) + (existingLinkUrl.length > 60 ? '…' : '');
    document.getElementById('f_link_url').value = existingLinkUrl;
  } else {
    fileLabel.textContent = '📎  Choose a file from device (PDF, image, doc…)';
    fileBox.classList.remove('has-file');
    fileHint.textContent = 'Uploads to AgriLink storage and becomes the ad link.';
    document.getElementById('f_link_url').value = '';
  }

  document.getElementById('formMsg').textContent = '';
  document.getElementById('formMsg').className = 'msg';
  document.getElementById('modal').style.display = 'block';
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
  const videoPreview = document.getElementById('videoPreview');
  try { videoPreview.pause(); } catch (e) {}
  videoPreview.src = '';
}

async function editAd(id) {
  const { data, error } = await db.from('app_advertisements').select('*').eq('id', id).single();
  if (error) { alert(error.message); return; }
  openModal(data);
}

async function toggleAd(id, current) {
  await db.from('app_advertisements').update({ is_active: !current }).eq('id', id);
  loadAds();
}

async function deleteAd(id) {
  if (!confirm('Delete this app ad?')) return;
  await db.from('app_advertisements').delete().eq('id', id);
  loadAds();
}

function attachPicker(pickerId, inputId, onChange) {
  document.getElementById(pickerId).addEventListener('click', () => {
    document.getElementById(inputId).click();
  });
  document.getElementById(inputId).addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (!f) return;
    onChange(f);
  });
}

function initPickers() {
  attachPicker('photoBox', 'photoInput', (file) => {
    pickedPhoto = file;
    const photoPreview = document.getElementById('photoPreview');
    const videoPreview = document.getElementById('videoPreview');
    const isVid = file.type.startsWith('video/') || isVideoUrl(file.name);

    if (isVid) {
      photoPreview.classList.remove('show');
      photoPreview.src = '';
      videoPreview.src = URL.createObjectURL(file);
      videoPreview.classList.add('show');
    } else {
      videoPreview.classList.remove('show');
      videoPreview.src = '';
      photoPreview.src = URL.createObjectURL(file);
      photoPreview.classList.add('show');
    }
    document.getElementById('photoLabel').textContent = '📷  ' + file.name;
    document.getElementById('photoBox').classList.add('has-file');
  });

  attachPicker('fileBox', 'fileInput', (file) => {
    pickedLinkFile = file;
    document.getElementById('fileLabel').textContent =
      '📎  ' + file.name + '  (' + (file.size/1024).toFixed(0) + ' KB)';
    document.getElementById('fileBox').classList.add('has-file');
    document.getElementById('fileHint').textContent =
      'This file will be uploaded and become the ad link.';
    document.getElementById('f_link_url').value = '';
  });

  document.getElementById('f_link_url').addEventListener('input', (e) => {
    if (e.target.value.trim().length > 0) {
      pickedLinkFile = null;
      document.getElementById('fileInput').value = '';
      document.getElementById('fileLabel').textContent =
        '📎  Choose a file from device (PDF, image, doc…)';
      document.getElementById('fileBox').classList.remove('has-file');
      document.getElementById('fileHint').textContent =
        'URL typed above will be used as the link.';
    }
  });
}

function guessMime(name) {
  const n = (name || '').toLowerCase();
  if (n.endsWith('.pdf')) return 'application/pdf';
  if (n.endsWith('.jpg') || n.endsWith('.jpeg')) return 'image/jpeg';
  if (n.endsWith('.png')) return 'image/png';
  if (n.endsWith('.gif')) return 'image/gif';
  if (n.endsWith('.webp')) return 'image/webp';
  if (n.endsWith('.mp4')) return 'video/mp4';
  if (n.endsWith('.webm')) return 'video/webm';
  if (n.endsWith('.mov')) return 'video/quicktime';
  if (n.endsWith('.doc')) return 'application/msword';
  if (n.endsWith('.docx')) return 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
  if (n.endsWith('.xls')) return 'application/vnd.ms-excel';
  if (n.endsWith('.xlsx')) return 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  if (n.endsWith('.txt')) return 'text/plain';
  if (n.endsWith('.csv')) return 'text/csv';
  if (n.endsWith('.zip')) return 'application/zip';
  return 'application/octet-stream';
}

async function uploadFile(file, label) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const safeExt = ext ? '.' + ext : '';
  const path = FOLDER + '/' + label + '-' + Date.now() + safeExt;
  const mime = file.type || guessMime(file.name);

  const { error } = await db.storage.from(BUCKET)
    .upload(path, file, { contentType: mime, upsert: false });
  if (error) throw error;

  const { data } = db.storage.from(BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

document.getElementById('newBtn').onclick = () => openModal(null);
document.getElementById('cancelBtn').onclick = closeModal;

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('formMsg');
  const btn = document.getElementById('saveBtn');
  msg.className = 'msg';
  msg.textContent = 'Saving…';
  btn.disabled = true;

  const id = document.getElementById('f_id').value;
  const typedUrl = document.getElementById('f_link_url').value.trim();

  try {
    let imageUrl = existingImageUrl;
    if (pickedPhoto) {
      msg.textContent = 'Uploading media…';
      imageUrl = await uploadFile(pickedPhoto, 'media');
    }

    let linkUrl = existingLinkUrl;
    if (pickedLinkFile) {
      msg.textContent = 'Uploading file…';
      linkUrl = await uploadFile(pickedLinkFile, 'file');
    } else if (typedUrl.length > 0) {
      linkUrl = typedUrl;
    }

    if (!linkUrl) {
      throw new Error('Please choose a file or paste a URL for the link.');
    }

    const payload = {
      title: document.getElementById('f_title').value.trim(),
      body: document.getElementById('f_body').value.trim(),
      button_label: document.getElementById('f_button_label').value.trim(),
      link_url: linkUrl,
      image_url: imageUrl,
      position: document.getElementById('f_position').value,
      sort_order: parseInt(document.getElementById('f_sort_order').value) || 1,
      display_seconds: Math.min(300, Math.max(5, parseInt(document.getElementById('f_display_seconds').value) || 30)),
      starts_at: document.getElementById('f_starts_at').value || null,
      ends_at: document.getElementById('f_ends_at').value || null,
      is_active: document.getElementById('f_is_active').checked
    };

    const { error } = id
      ? await db.from('app_advertisements').update(payload).eq('id', id)
      : await db.from('app_advertisements').insert(payload);

    if (error) throw error;

    msg.className = 'msg ok';
    msg.textContent = '✅ Saved.';
    setTimeout(() => { closeModal(); loadAds(); }, 500);

  } catch (err) {
    msg.className = 'msg';
    msg.textContent = '❌ ' + (err.message || 'Failed');
    btn.disabled = false;
  }
});

(async () => {
  initPickers();
  if (await requireLogin()) loadAds();
})();
</script>
</body>
</html>
